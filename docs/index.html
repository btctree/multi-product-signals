<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <!-- Content stamp for the update check. Regenerate with
       python execution/stamp_app.py  (a test fails if it is stale). -->
  <meta name="app-build" content="73a95f7e2b26">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Signals">
<meta name="theme-color" content="#0b1220">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<title>Multi-Product Signals</title>
<style>
  :root{
    --bg:#0b1220; --card:#151f31; --card2:#1c2942; --line:#243352;
    --txt:#e8eef7; --dim:#93a4c0; --green:#37d67a; --red:#ff6b6b;
    --amber:#ffc14d; --blue:#4d9bff; --nav-h:64px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Arial,sans-serif;
    font-size:15px;line-height:1.45;
    overflow-x:hidden;max-width:100vw}   /* page must never pan sideways */
  a{color:var(--blue)}
  header{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,#0e1830,#0b1220);
    padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;border-bottom:1px solid var(--line)}
  header h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.2px}
  header .sub{color:var(--dim);font-size:12px;margin-top:2px}
  .stats{display:flex;gap:8px;margin-top:10px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .stat{flex:0 0 auto;background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:6px 11px;font-size:12px}
  .stat b{display:block;font-size:15px;color:var(--green)}
  main{padding:14px 14px calc(var(--nav-h) + env(safe-area-inset-bottom) + 20px)}
  .view{display:none}
  /* every tab fills at least the full screen so switching tabs never jumps */
  .view.active{display:block;min-height:calc(100dvh - 230px)}
  .btn-rec{display:block;width:100%;margin-top:10px;padding:11px;font-size:14px;
    font-weight:700;color:var(--green);background:rgba(55,214,122,.10);
    border:1px solid rgba(55,214,122,.45);border-radius:12px;cursor:pointer}
  .btn-row{display:flex;gap:8px;margin-top:10px}
  .btn-sm{flex:1;padding:9px;font-size:13px;font-weight:600;border-radius:10px;
    cursor:pointer;background:var(--card2);color:var(--txt);border:1px solid var(--line)}
  .btn-sell{color:var(--red);border-color:rgba(255,107,107,.4)}
  .list-row{display:flex;justify-content:space-between;align-items:center;
    padding:11px 12px;border-bottom:1px solid var(--line);cursor:pointer}
  .list-row:active{background:var(--card2)}
  .list-wrap{background:var(--card);border:1px solid var(--line);border-radius:14px;
    overflow:hidden;margin-top:12px}
  .chips{display:flex;gap:6px;margin-top:10px;overflow-x:auto;
    -webkit-overflow-scrolling:touch;padding-bottom:2px}
  .chip{flex:0 0 auto;font-size:12px;font-weight:600;padding:7px 12px;
    border-radius:18px;border:1px solid var(--line);background:var(--card);
    color:var(--dim);cursor:pointer;white-space:nowrap}
  .chip.on{background:rgba(77,155,255,.15);border-color:var(--blue);color:var(--blue)}
  .score-badge{display:inline-block;min-width:58px;height:40px;line-height:29px;
    text-align:center;font-size:18px;box-sizing:border-box;
    font-weight:800;padding:5px 10px;border-radius:12px;color:var(--green);
    background:rgba(55,214,122,.12);border:1px solid rgba(55,214,122,.4)}
  button.score-badge{cursor:pointer;background:rgba(55,214,122,.28);
    font-family:inherit}
  button.score-badge:active{background:rgba(55,214,122,.5)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:14px;margin-bottom:12px}
  .row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .sym{font-weight:700;font-size:16px} .nm{color:var(--dim);font-size:12px}
  .badge{font-size:11px;font-weight:700;padding:4px 9px;border-radius:20px;white-space:nowrap}
  .b-BUY,.b-BUYHOLD{background:rgba(55,214,122,.15);color:var(--green);border:1px solid rgba(55,214,122,.4)}
  .b-WATCH{background:rgba(255,193,77,.13);color:var(--amber);border:1px solid rgba(255,193,77,.4)}
  .b-HOLD{background:rgba(77,155,255,.13);color:var(--blue);border:1px solid rgba(77,155,255,.4)}
  .b-AVOID{background:rgba(255,107,107,.12);color:var(--red);border:1px solid rgba(255,107,107,.35)}
  .levels{display:flex;gap:8px;margin:10px 0 6px;flex-wrap:wrap}
  .lv{flex:1 1 30%;background:var(--card2);border-radius:10px;padding:7px 9px;min-width:84px}
  .lv span{display:block;color:var(--dim);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
  .lv b{font-size:15px} .lv.t b{color:var(--green)} .lv.s b{color:var(--red)}
  .exp{color:var(--txt);font-size:13px;margin:6px 0}
  ul.rz{margin:6px 0 0;padding-left:18px} ul.rz li{margin:3px 0;color:var(--dim);font-size:13px}
  .conf{font-size:11px;color:var(--dim)} .conf b{color:var(--txt)}
  .muted{color:var(--dim);font-size:13px;text-align:center;padding:24px}
  .search-box{position:relative}
  #q{width:100%;padding:13px 14px;font-size:16px;background:var(--card);color:var(--txt);
    border:1px solid var(--line);border-radius:14px;outline:none}
  #q:focus{border-color:var(--blue)}
  #hits{position:absolute;left:0;right:0;top:52px;z-index:8;background:var(--card2);
    border:1px solid var(--line);border-radius:12px;max-height:46vh;overflow:auto;display:none}
  #hits div{padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer}
  #hits div:hover{background:var(--card)}
  #hits .h-sym{font-weight:700} #hits .h-nm{color:var(--dim);font-size:12px}
  .chart-wrap{background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:10px;margin:12px 0}
  canvas{width:100%!important;height:220px!important}
  /* the vs-S&P card lands two round trips after the positions list; hold its
     slot open or it shoves the list - and its Sell buttons - down ~590px */
  #bench-card:empty{min-height:600px}
  .cal-cell.tap{cursor:pointer;-webkit-tap-highlight-color:rgba(77,155,255,.25)}
  .tap-card{cursor:pointer;-webkit-tap-highlight-color:rgba(77,155,255,.18)}
  .tap-card:active{border-color:var(--blue)}
  .cal-cell.tap:active{border-color:var(--blue)}
  .sheet-bg{position:fixed;inset:0;z-index:60;background:rgba(3,7,16,.66);
    display:flex;align-items:flex-end;animation:fade .12s ease-out}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .sheet{width:100%;max-height:88vh;overflow:auto;background:var(--card);
    border:1px solid var(--line);border-top-left-radius:18px;border-top-right-radius:18px;
    padding:12px 16px calc(env(safe-area-inset-bottom) + 20px)}
  .sheet-grip{width:38px;height:4px;border-radius:2px;background:var(--line);margin:2px auto 10px}
  .part{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:7px 0;
    border-bottom:1px solid var(--line)}
  .part .bar{grid-column:1/3;height:5px;border-radius:3px;background:rgba(147,164,192,.14);overflow:hidden}
  .part .bar>i{display:block;height:100%}
  nav{position:fixed;bottom:0;left:0;right:0;height:calc(var(--nav-h) + env(safe-area-inset-bottom));
    padding-bottom:env(safe-area-inset-bottom);background:rgba(13,20,36,.92);
    backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex}
  nav button{flex:1;background:none;border:none;color:var(--dim);font-size:10.5px;
    display:flex;flex-direction:column;align-items:center;gap:3px;padding-top:9px;cursor:pointer}
  nav button.on{color:var(--blue)} nav svg{width:22px;height:22px;fill:currentColor}
  .sec-h{font-size:13px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin:4px 2px 10px}
  .pnl-pos{color:var(--green)} .pnl-neg{color:var(--red)}
  /* P&L calendar */
  #v-calendar{overflow-x:hidden}
  .cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;
    width:100%;max-width:100%}
  .cal-w{text-align:center;font-size:11px;color:var(--dim);font-weight:700;padding:2px 0}
  .cal-cell{min-width:0;overflow:hidden;min-height:58px;border:1px solid var(--line);
    border-radius:10px;padding:4px 4px;display:flex;flex-direction:column;gap:1px;
    background:var(--card2)}
  .cal-cell b{font-size:11.5px;line-height:1.15;font-weight:800;white-space:nowrap}
  .cal-d{font-size:10px;color:var(--dim);font-weight:700;white-space:nowrap}
  .cal-pct{font-size:10px;font-weight:700;opacity:.85;white-space:nowrap}
  @media (max-width:430px){   /* iPhone-class widths: shrink to guarantee fit */
    .cal-grid{gap:3px}
    .cal-cell{min-height:52px;padding:3px 3px;border-radius:8px}
    .cal-cell b{font-size:10px}
    .cal-d{font-size:9px}
    .cal-pct{font-size:8.5px}
  }
  .cal-empty{background:transparent;border-color:transparent}
  .cal-up{background:rgba(64,199,129,.16);border-color:rgba(64,199,129,.45);color:var(--green)}
  .cal-dn{background:rgba(255,107,96,.16);border-color:rgba(255,107,96,.5);color:var(--red)}
  .cal-flow{font-size:10px;margin-left:3px;opacity:.9}
  .cal-nav{width:38px;height:34px;border-radius:10px;border:1px solid var(--line);
    background:var(--card2);color:inherit;font-size:18px;font-weight:700;cursor:pointer}
  .pill{display:inline-block;font-size:10px;padding:2px 7px;border-radius:20px;
    background:var(--card2);color:var(--dim);margin-left:6px}
</style>

<body>
<!-- padding-top carries the safe-area inset: with viewport-fit=cover the page
     runs under the status bar, so a plain top:0 banner hides its own text
     behind the iPhone 14 Pro Dynamic Island. header/main/nav already do this. -->
<div id="refresh-ind" style="display:none;position:fixed;top:0;left:0;right:0;z-index:99;
  align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:600;
  padding:calc(env(safe-area-inset-top) + 9px) 9px 9px;
  background:var(--card,#1b1e27);color:var(--fg,#e8eaed);border-bottom:1px solid rgba(255,255,255,.12)">↓ Pull to refresh</div>
<header>
  <h1>Multi-Product Signals</h1>
  <div class="sub" id="prod">Loading…</div>
  <div class="stats" id="stats"></div>
  <button onclick="forceRefresh()" style="margin-top:8px;width:100%;padding:9px;border:0;border-radius:10px;
    background:rgba(255,255,255,.10);color:inherit;font-weight:600;font-size:13px;cursor:pointer">↻ Refresh now</button>
</header>

<main>
  <section id="v-actions" class="view active"></section>
  <section id="v-positions" class="view"></section>
  <section id="v-history" class="view"></section>
  <section id="v-calendar" class="view"></section>
  <section id="v-search" class="view">
    <div class="search-box">
      <input id="q" placeholder="Search name, symbol or code…" autocomplete="off" autocapitalize="off" style="padding-right:52px">
      <button id="qclear" onclick="clearSearch()" title="Clear"
        style="position:absolute;right:8px;top:8px;bottom:8px;width:36px;border-radius:10px;
        border:1px solid var(--line);background:var(--card2);color:var(--dim);
        font-size:16px;cursor:pointer">✕</button>
      <div id="hits"></div>
    </div>
    <div id="chips-m" class="chips"></div>
    <div id="chips-a" class="chips"></div>
    <div id="detail"></div>
  </section>
</main>

<nav>
  <button data-v="actions" class="on" onclick="tab('actions',this)">
    <svg viewBox="0 0 24 24"><path d="M3 13h2l3 6 4-14 3 8h6" fill="none" stroke="currentColor" stroke-width="2"/></svg>Actions</button>
  <button data-v="positions" onclick="tab('positions',this)">
    <svg viewBox="0 0 24 24"><path d="M4 6h16v12H4z M4 10h16" fill="none" stroke="currentColor" stroke-width="2"/></svg>Positions</button>
  <button data-v="history" onclick="tab('history',this)">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7v5l3 2" fill="none" stroke="currentColor" stroke-width="2"/></svg>History</button>
  <button data-v="calendar" onclick="tab('calendar',this)">
    <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 10h18M8 3v4M16 3v4" fill="none" stroke="currentColor" stroke-width="2"/></svg>Calendar</button>
  <button data-v="search" onclick="tab('search',this)">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2"/></svg>Search</button>
</nav>

<script>
const $=s=>document.querySelector(s);
const safe=s=>s.replaceAll('^','_IDX_').replaceAll('=','_EQ_').replaceAll('.','_');
let DATA=null, IDX=[], chart=null, BOT=null;
// Live state of the automated IB bot (positions it holds + orders it placed),
// published by the VM after every run. Fetched raw so it's fresh without waiting
// for the hourly Pages rebuild.
const BOT_STATE_URL='https://raw.githubusercontent.com/btctree/multi-product-signals/main/data/bot_state.json';
async function loadBot(){
  try{
    const r=await fetch(BOT_STATE_URL+'?t='+Date.now());
    if(r.ok){
      BOT=await r.json();
      // The vs-S&P card joins this live NetLiq to the history file, whose
      // deposits/withdrawals list is entered by hand AFTER the event. Left as
      // it was when the page opened, a withdrawal made while the page is open
      // shows as a loss and a deep dip until the next full reload. So mark it
      // for a refetch alongside every refresh of the live state.
      if(BENCH&&!BENCH.err) BENCH.stale=true;
      renderPositions(); renderHistory(); refreshFills();
    }
  }catch(e){}
}
// Full refresh: re-pull signal data AND live bot state, then re-render everything.
let _refreshing=false;
async function forceRefresh(){
  if(_refreshing) return; _refreshing=true;
  const el=document.getElementById('refresh-ind');
  if(el){ el.style.display='flex'; el.textContent='↻ Refreshing…'; }
  try{
    const r=await fetch('data.json?t='+Date.now()); DATA=await r.json(); IDX=DATA.index||[];
    await loadBot();
    CAL=null;                                    // calendar refetches too
    BENCH=null;                                  // and so does the vs-S&P card
    checkAppVersion();                           // is the PAGE itself stale?
    if(document.querySelector('#v-calendar.active')) loadCal();
    renderActions&&renderActions(); renderAllProducts&&renderAllProducts();
    // If this device has the command token, ALSO ask the VM to capture a fresh
    // snapshot straight from IB. That request is a GitHub ISSUE, and it used to
    // be opened on EVERY refresh - so the live repo's last 100 owner issues were
    // all "REFRESH", 38 of them inside one 48 h window. That churn is what let a
    // pending SELL fall out of the poller's fetch window, and it litters a public
    // repo besides.
    //
    // Two gates, both about whether the request would achieve anything:
    //   * The VM reads commands every 10 MINUTES. A second request inside that
    //     window cannot be acted on any sooner, so it is pure noise.
    // There is deliberately NO second gate on how OLD the snapshot looks.
    // BOT.updated is a PUBLISH stamp, not a correctness stamp: a poll that runs
    // a phone SELL republishes seconds after placing the order, reading IB's
    // CACHED positions about two seconds after placeOrder - often before the
    // order has even filled. The snapshot then says "updated 10:11" while still
    // showing the stock as held. An age test would call that fresh and suppress
    // re-capture for the next quarter hour - tightest exactly while the owner
    // is asking whether his exit went through, because running the command is
    // what made the state look young. The same window catches the overnight
    // exits that rest PreSubmitted in a shut venue and fill at the :30 opens.
    // The rate limit needs no such reasoning: it is true by construction.
    // Either way the refresh itself still happens - the data is re-pulled and
    // everything re-rendered. This only skips ASKING THE VM for a new capture,
    // and only when the last ask cannot have been acted on yet.
    let live='';
    const tok=localStorage.getItem('mps_gh_token');
    const lastAsk=+(localStorage.getItem('mps_last_refresh_issue')||0);
    const sinceAsk=(Date.now()-lastAsk)/60000;                 // minutes
    const worthAsking=sinceAsk>=10;
    // Never "already up to date" - the page cannot know that. Say the one thing
    // that IS true: a capture is already on its way.
    if(tok&&!worthAsking) live=' · re-capture already requested';
    if(tok&&worthAsking){
      try{
        const rr=await fetch('https://api.github.com/repos/btctree/multi-product-signals/issues',{
          method:'POST',
          headers:{'Authorization':'Bearer '+tok,'Accept':'application/vnd.github+json','Content-Type':'application/json'},
          body:JSON.stringify({title:'REFRESH', body:'Live re-capture requested from the dashboard refresh.'})});
        if(rr.status===201){
          live=' · live IB re-capture in ~10 min';
          // remembered per device, so a second tap inside the poller's own
          // 10-minute cycle does not open a second issue for the same capture
          try{ localStorage.setItem('mps_last_refresh_issue', String(Date.now())); }catch(e){}
        }
      }catch(e){}
    }
    if(el){ el.textContent='✓ Updated '+(BOT&&BOT.updated?BOT.updated:'')+live; setTimeout(()=>el.style.display='none',2600); }
  }catch(e){ if(el){ el.textContent='⚠️ refresh failed'; setTimeout(()=>el.style.display='none',2000);} }
  _refreshing=false;
}
// Pull-to-refresh: drag DOWN past the top of the page on touch, or the button.
(function(){
  let y0=null;
  addEventListener('touchstart',e=>{
    // A drag that starts inside the day sheet belongs to the sheet - the page
    // behind it never scrolled, so scrollY is still 0 and dragging back to the
    // top of a long sheet would otherwise fire "Release to refresh" over it.
    const inSheet=e.target&&e.target.closest&&e.target.closest('.sheet-bg');
    y0=(scrollY<=0&&!inSheet)?e.touches[0].clientY:null;},{passive:true});
  addEventListener('touchmove',e=>{
    if(y0!=null){ const dy=e.touches[0].clientY-y0;
      const el=document.getElementById('refresh-ind');
      if(dy>10&&el){ el.style.display='flex'; el.textContent=dy>90?'↓ Release to refresh':'↓ Pull to refresh'; } }
  },{passive:true});
  addEventListener('touchend',e=>{
    if(y0!=null){ const el=document.getElementById('refresh-ind');
      if(el&&el.textContent.includes('Release')) forceRefresh();
      else if(el) el.style.display='none'; }
    y0=null;
  },{passive:true});
})();

function badge(a){const k=a.replace(/[^A-Z]/g,'');return `<span class="badge b-${k}">${a}</span>`}
function money(x){
  if(x==null) return '—';
  const n = typeof x==='number' ? x : parseFloat(x);
  if(!isFinite(n)) return ''+x;
  // Round for display only; callers keep full precision for arithmetic.
  // Two sources of float noise reach this: IB's cost basis, now shown as Entry
  // (7733 booked at 2066.1516), and the engine's ATR-derived stops
  // (459.965912). 2dp suits every instrument this account trades; sub-unit
  // prices keep more, where 2dp would destroy the value.
  const r = Math.abs(n)>=1 ? Math.round(n*100)/100 : Math.round(n*1e6)/1e6;
  return ''+r;
}

function cardHTML(c, showScore){
  const lv = (c.entry||c.target||c.stop) ? `<div class="levels">
      ${c.entry!=null?`<div class="lv"><span>Entry</span><b>${c.entry}</b></div>`:''}
      ${c.target!=null?`<div class="lv t"><span>Target</span><b>${c.target}</b></div>`:''}
      ${c.stop!=null?`<div class="lv s"><span>Cut-loss</span><b>${c.stop}</b></div>`:''}
    </div>`:'';
  const isBuy=(c.action==='BUY'||c.action==='BUY/HOLD');
  // green BUY box IS the record button, same size as the score box
  const buyBox = isBuy ?
    `<div style="text-align:center"><button class="score-badge" data-sym="${c.symbol||c.sym}"
       onclick="recordBuy(this.dataset.sym)">BUY</button><div class="nm">tap = bought</div></div>` : '';
  const scoreBox = (showScore && c.score!=null) ?
    `<div style="text-align:center"><div class="score-badge">${c.score}</div>
     <div class="nm">${c.score_band||''}</div></div>` : '';
  const sc = (buyBox||scoreBox) ?
    `<div style="display:flex;align-items:flex-start;gap:8px">${buyBox}${scoreBox}</div>`
    : badge(c.action);
  // Tapping the card opens the chart behind the decision (sigSheet). The BUY
  // button inside it must keep working, so a tap that lands on one is left alone.
  // The card object is remembered under its symbol so the sheet shows the verdict
  // and the levels THIS card states, not a later build's (board review 2026-09-23):
  // the rendered cards outlive DATA, which liveTick replaces every five minutes.
  SIG_CARDS[c.symbol||c.sym]=c;
  return `<div class="card tap-card" onclick="if(!event.target.closest('button'))sigSheet('${c.symbol||c.sym}')">
    <div class="row"><div><div class="sym">${c.symbol||c.sym} <span class="pill">${c.market}</span></div>
      <div class="nm">${c.name}</div></div>${sc}</div>
    <div class="conf">Regime: <b>${c.regime}</b> · Price <b>${c.price}</b> · Confidence <b>${c.confidence||'—'}</b></div>
    ${lv}
    <div class="exp">${c.expectation||''}</div>
    ${c.reasons&&c.reasons.length?`<ul class="rz">${c.reasons.map(r=>`<li>${r}</li>`).join('')}</ul>`:''}
  </div>`;
}

// ---- on-phone position tracking (stored in this device's browser) ----
const lsGet=k=>{try{return JSON.parse(localStorage.getItem(k))||[]}catch(e){return[]}};
const lsSet=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
function findCard(sym){return (DATA.actions||[]).find(c=>(c.symbol||c.sym)===sym)
  || (IDX.find(o=>o.sym===sym)?{symbol:sym,price:IDX.find(o=>o.sym===sym).price}:null);}
function recordBuy(sym){
  const c=findCard(sym); if(!c)return;
  const px=parseFloat(prompt(`Your fill price for ${sym}:`, c.price)); if(!px)return;
  const qty=parseFloat(prompt(`Quantity (shares/units) for ${sym}:`, '1'))||1;
  const pos=lsGet('mps_positions');
  const ex=pos.find(p=>p.sym===sym);
  if(ex){ // add to an existing position: blend average entry
    const tot=ex.qty+qty;
    ex.entry=Math.round((ex.entry*ex.qty+px*qty)/tot*10000)/10000; ex.qty=tot;
  }else{
    pos.push({sym, name:c.name||sym, entry:px, qty,
              entry_date:new Date().toISOString().slice(0,10),
              target:c.target||null, stop:c.stop||null,
              sleeve:(c.market==='CRYPTO'?'CRY':'DIP')});
  }
  lsSet('mps_positions',pos); renderPositions();
  alert(`Tracked: ${qty} x ${sym} @ ${px}\n\nNow place the resting orders with your broker:\n`+
        (c.target?`• SELL LIMIT at ${c.target}\n`:'')+(c.stop?`• SELL STOP at ${c.stop}`:''));
}
function recordSell(sym){
  const pos=lsGet('mps_positions'); const p=pos.find(x=>x.sym===sym); if(!p)return;
  const live=IDX.find(o=>o.sym===sym);
  const px=parseFloat(prompt(`Your exit price for ${sym}:`, live?live.price:p.entry)); if(!px)return;
  let q=parseFloat(prompt(`Quantity to sell (you hold ${p.qty||1}) — enter less for a PARTIAL sell:`, p.qty||1));
  if(!q||q<=0)return; q=Math.min(q,p.qty||1);
  const pnl=Math.round((px/p.entry-1)*1000)/10;
  const h=lsGet('mps_history');
  h.push({id:Date.now(), date:new Date().toISOString().slice(0,10), action:(q<(p.qty||1)?'PARTIAL SELL':'SELL'),
          sym, name:p.name, qty:q, price:px, entry:p.entry, pnl_pct:pnl,
          pnl_amt:Math.round((px-p.entry)*q*100)/100});
  if(q<(p.qty||1)){ p.qty=Math.round((p.qty-q)*10000)/10000; lsSet('mps_positions',pos); }
  else{ lsSet('mps_positions',pos.filter(x=>x.sym!==sym)); }
  lsSet('mps_history',h);
  renderPositions(); renderHistory();
}
function delPos(sym){
  if(!confirm('Remove '+sym+' without logging a trade?'))return;
  lsSet('mps_positions',lsGet('mps_positions').filter(x=>x.sym!==sym)); renderPositions();
}
function delHist(id){
  if(!confirm('Delete this trade record?'))return;
  lsSet('mps_history',lsGet('mps_history').filter(x=>String(x.id)!==String(id)));
  renderHistory();
}

// P1: exit alerts — evaluate each held product's CURRENT engine state hourly
async function exitAlert(x, last){
  try{
    const r=await fetch('products/'+safe(x.sym)+'.json'); const p=await r.json();
    const c=p.card||{};
    if(c.sma200!=null && last!=null && last < c.sma200)
      return {level:'sell', msg:`⚠ SELL — closed below its 200-day average (${c.sma200}). The engine exits here.`};
    if(x.stop!=null && last!=null && last <= x.stop)
      return {level:'sell', msg:`⚠ SELL — your cut-loss ${x.stop} was hit.`};
    if(c.atr && last!=null && x.entry){
      // Anchor on the SIGNAL price, matching the engine exactly:
      //   ib_bot.py  k = 2.0 if price >= st["entry"] + 1.5*atr else 3.5
      // `entry` now carries IB's cost basis so the P&L rows are honest, but
      // feeding that here would flip the multiplier at a different price from
      // the bot, and the banner would advise a stop the engine will never
      // adopt - out by 1.5*ATR, about 3.6% of price. Reachable on 7 of 13 live
      // positions. Fall back to entry for hand-recorded rows, which have no
      // signal price and no engine trail to mirror.
      const anchor = x.sig_entry!=null ? x.sig_entry : x.entry;
      const gain=(last-anchor)/(c.atr||1);
      const k = gain>=1.5 ? 2.0 : 3.5;             // engine trail: tightens in profit
      const trail=Math.round((last-k*c.atr)*100)/100;
      if(x.stop!=null && trail > x.stop)
        return {level:'trail', msg:`Raise your stop to ~${trail} (chandelier trail moved up).`};
    }
  }catch(e){}
  return null;
}
// Which order the position cards are in. Kept on the device, so the phone opens
// the way it was left; an unknown value falls back to the default.
function posSort(){
  try{ const v=localStorage.getItem('mps_pos_sort');
       return (v==='old'||v==='pnl'||v==='pnl_low')?v:'new'; }catch(e){ return 'new'; }
}
function setPosSort(k){
  try{ localStorage.setItem('mps_pos_sort',k); }catch(e){}
  renderPositions();
}
function renderPositions(){
  const el=$('#v-positions');
  const local=lsGet('mps_positions');
  const server=DATA.positions||[];
  // live positions held by the automated IB bot (no manual entry needed);
  // 3-letter currency "positions" are FX legs, shown under Cash instead
  const CCY3=new Set(['HKD','USD','JPY','EUR','GBP','CHF','AUD','CAD','CNH','SGD']);
  const bot=(BOT&&BOT.positions||[]).filter(b=>!CCY3.has(String(b.symbol).toUpperCase()))
    .map(b=>({
    sym:b.symbol, name:'auto-traded on IB'+(b.ccy?` · ${b.ccy}`:''),
    // P&L on a HELD position must be measured against what was actually PAID.
    // avg_cost is IB's cost basis (fill price plus commission); entry is only
    // the price the signal fired at. 7733 filled at 2064.5 on a 2061 signal and
    // IB books it at 2066.15, so preferring `entry` understated that row's loss
    // by 515 JPY. Across all 13 positions the skew was 229 HKD, partly
    // self-cancelling because some fills beat the signal and others missed it.
    // Fall back to entry only when IB has given no cost basis.
    // Guard is >0, not truthiness: a null/0/missing basis falls back to the
    // signal price, and a negative one - which is meaningless for a long - is
    // ignored rather than rendered as a negative entry.
    sleeve:'AUTO', qty:b.qty, entry:b.avg_cost>0?b.avg_cost:b.entry,
    // The SIGNAL price, kept separately. `entry` above is now IB's cost basis
    // so the P&L rows are honest, but exitAlert's chandelier k-switch must stay
    // anchored on the signal price because that is what the engine uses.
    sig_entry:b.entry,
    stop:b.stop, src:'bot'}));
  const botSyms=new Set(bot.map(x=>x.sym));
  const rows=[...bot,
              ...local.filter(x=>!botSyms.has(x.sym)).map(x=>({...x,src:'local'})),
              ...server.filter(x=>!botSyms.has(x.sym)).map(x=>({...x,src:'server'}))];
  // Newest holding at the top, the oldest at the bottom (owner's request,
  // 2026-09-22). A bot row's age is the first buy of the lot still held, from
  // the fills ledger (entryDateOf); a phone-recorded row carries its own date.
  // Until the ledger has loaded nothing is known and the order is IB's; the
  // load re-renders once. An undated row goes to the TOP: a holding the
  // ledger has not caught up with is the newest one. Ties keep IB's order
  // (the sort is stable). The date is kept in `since`, never written into
  // entry_date, which entryDateOf reads back as a phone row's own date.
  // Age and P&L are worked out once here: the cards below and the sort must
  // never disagree about a number the owner is reading off the same row.
  rows.forEach(x=>{
    const d=(x.src==='bot'?entryDateOf(x.sym):null)||x.entry_date||null;
    x.since=d?String(d).slice(0,10):'';
    const live=IDX.find(o=>o.sym===x.sym);
    x._last=x.last!=null?x.last:(live?live.price:null);
    x._pnl=x.pnl_pct!=null?x.pnl_pct
          :((x._last&&x.entry)?Math.round((x._last/x.entry-1)*1000)/10:null);
  });
  // Order (owner's request, 2026-09-24). Newest first stays the default. An
  // undated row is one the fills ledger has not caught up with, i.e. the newest
  // thing here, so it leads under "newest" and trails under "oldest"; a row with
  // no P&L yet (no price or no entry) always trails. Ties keep IB's order,
  // because Array.prototype.sort is stable.
  const cmp={
    new:(a,b)=>{ const ka=a.since||'~', kb=b.since||'~'; return ka===kb?0:(ka<kb?1:-1); },
    old:(a,b)=>{ const ka=a.since||'~', kb=b.since||'~'; return ka===kb?0:(ka<kb?-1:1); },
    pnl:(a,b)=>(b._pnl==null?-Infinity:b._pnl)-(a._pnl==null?-Infinity:a._pnl),
    pnl_low:(a,b)=>(a._pnl==null?Infinity:a._pnl)-(b._pnl==null?Infinity:b._pnl),
  };
  rows.sort(cmp[posSort()]||cmp.new);
  // the chart sheet needs the same rows the cards are drawn from, and they
  // are assembled here from three sources - so hand them over rather than
  // rebuilding (and drifting from) the merge above.
  POSROWS=rows;
  ensurePosLedgers();              // dividends on each card need both ledgers
  // staleness banner: bot_state is republished hourly at :20, so >2h without an
  // update means the VM or the IB gateway is not talking (e.g. a gateway whose
  // port is open but whose API session died — 2026-08-01 17:20-19:20, silent).
  const staleH=(()=>{ if(!(BOT&&BOT.updated)) return null;
    const t=Date.parse(String(BOT.updated).replace(' UTC','Z').replace(' ','T'));
    return isFinite(t)?(Date.now()-t)/3600000:null; })();
  const staleNote=(staleH!=null&&staleH>2)?`<div class="card" style="padding:12px 16px;margin-bottom:10px;
    border:2px solid #ff6b60;background:rgba(255,107,96,.14)">
    <div style="font-weight:800;color:#ff8a80;font-size:15px">⚠ Bot data ${staleH>=24?Math.floor(staleH/24)+'d':Math.floor(staleH)+'h'} old</div>
    <div style="margin-top:3px;color:#ffd9d5">Expected hourly. The VM or IB Gateway is likely
    down — positions below may be out of date and exits may not be running.</div></div>`:'';
  // HKD cash must not count toward the pool. It is removed in ONE of two places,
  // never both - subtracting it here as well is what showed 191,654 instead of
  // 210,286:
  //   marker present -> the publisher already took `excluded_cash` out of netliq,
  //                     so only the REMAINDER (cash.HKD - excluded_cash) is still
  //                     inside and needs netting off here. A cleared marker is
  //                     published as the number 0, not omitted, so it lands here
  //                     too and the whole HKD balance gets netted.
  //   marker absent  -> a publisher predating the marker, which still subtracts
  //                     the earmarked cash from netliq itself. Take nothing.
  // Absent and cleared are NOT the same case - do not collapse them.
  //
  // TEMPORARY THIRD CASE (remove once the VM runs the capped publisher, a0984ea):
  // the VM is still running PRE-CAP code. It subtracts the whole 18,559 marker
  // even though the money was withdrawn on 2026-08-31 and only cash.HKD is left
  // here, understating net worth by the difference and booking it as a one-day
  // calendar loss. The capped publisher can NEVER emit excluded_cash > cash.HKD,
  // so that inequality identifies the stale publisher with no false positives -
  // and the moment the VM updates, this goes inert on its own.
  const hkdCash=(BOT&&BOT.cash&&typeof BOT.cash.HKD==='number')?BOT.cash.HKD:0;
  const exCash=(BOT&&typeof BOT.excluded_cash==='number')?BOT.excluded_cash:hkdCash;
  // The operator's raw marker (display only; older publishers omit it -> null).
  const earMarker=(BOT&&typeof BOT.earmark_marker==='number')?BOT.earmark_marker:null;
  // The bot's own HKD, identified from its stamped executions and left IN the
  // pool (execution/earmark.py). null = the publisher could not confirm it and
  // applied the plain cap; a MISSING key is an older publisher. Both keep the
  // page exactly as it was, so only a number changes anything below.
  const botHkd=(BOT&&typeof BOT.earmark_bot_hkd==='number')?BOT.earmark_bot_hkd:null;
  // ONE exclusion rule: the earmark, and nothing else.
  // Both publishers already subtract it from netliq (publish_web.py `nl -= exc`,
  // ib_bot.net_liq) and report what they took out as excluded_cash - so the
  // published netliq IS "everything except the earmark". Subtracting the rest of
  // the HKD balance here too was a SECOND exclusion that the bot never applies:
  // it sized positions (NetLiq/15) against that money while this page hid it, so
  // the number the operator checked and the number the bot traded on disagreed by
  // the whole HKD balance. It also read the HKD the bot now BUYS to fund a SEHK
  // entry as a HK$14,000 loss until the order filled - overnight, given SEHK's
  // hours. Unearmarked HKD is flagged in the card below instead of hidden.
  const hkdInNet=0;
  const netExHkd=(BOT&&typeof BOT.netliq==='number')?BOT.netliq-hkdInNet:null;
  const botNote=BOT&&BOT.updated?`<div class="card" style="padding:12px 16px;margin-bottom:10px">
    <div class="nm">Account net worth</div>
    <div style="font-size:26px;font-weight:800;letter-spacing:.3px">${netExHkd!=null?netExHkd.toLocaleString():'—'} <span style="font-size:14px;font-weight:600">${BOT.base_ccy||''}</span></div>
    <div class="nm" style="margin-top:2px">🤖 live from IB · synced ${BOT.updated}${exCash?` · excl. ${exCash.toLocaleString()} HKD earmarked`:''}</div></div>`:'';
  // HKD cash is excluded from every figure on this page by request: it is the
  // base-currency sweep balance, not part of the investable pool. Positions and
  // the other currency balances are unaffected.
  const cash=BOT&&BOT.cash?Object.entries(BOT.cash)
    .sort((a,b)=>Math.abs(b[1])-Math.abs(a[1])):[];
  const cashHtml=cash.length?`<div class="sec-h">💰 Cash on hand</div><div class="card" style="padding:8px 14px">`+
    cash.map(([c,v])=>`<div class="row" style="padding:5px 0"><span class="nm" style="font-weight:600">${c}</span>
      <b class="${v<0?'pnl-neg':''}">${v.toLocaleString()}</b></div>`).join('')+
    `<div class="nm" style="padding:6px 0 2px;font-size:11px;opacity:.7">Earmarked HKD is excluded from net worth — see below</div></div>`:'';
  // The operator's month-end routine is a GBP deposit converted to HKD and
  // withdrawn days later. That money is not trading capital: left unmarked it
  // inflates NetLiq, and the bot sizes positions at NetLiq/15 off money that is
  // about to leave. Marking it is therefore worth more than the display - it is
  // the sizing. The button writes the same marker the VM reads.
  const earHtml=BOT?`<div class="sec-h">🔖 HKD — not trading capital</div>
    <div class="card" style="padding:10px 14px">
      <div class="row" style="padding:4px 0"><span class="nm">HKD balance</span>
        <b>${hkdCash.toLocaleString()}</b></div>
      ${botHkd!=null?`<div class="row" style="padding:4px 0"><span class="nm">Bot's own HKD — stays in the pool</span>
        <b>${botHkd.toLocaleString()}</b></div>`:''}
      <div class="row" style="padding:4px 0"><span class="nm">Earmarked — excluded from the pool</span>
        <b>${exCash.toLocaleString()}</b></div>
      ${(earMarker!=null&&earMarker>exCash+1)?(botHkd!=null?`<div class="nm" style="padding:6px 0 2px;color:#ffb86b">
        ⚠ Your marker is ${earMarker.toLocaleString()} but only ${Math.max(0,hkdCash-botHkd).toLocaleString()} of the HKD here is yours;
        the bot holds ${botHkd.toLocaleString()}. If the deposit has already left, send 0 to clear it.
        If the GBP simply has not converted yet, this is expected.</div>`:`<div class="nm" style="padding:6px 0 2px;color:#ffb86b">
        ⚠ Your marker is ${earMarker.toLocaleString()} but only ${hkdCash.toLocaleString()} HKD is here.
        If the deposit has already left, send 0 to clear it — until you do, any HKD the bot buys
        for a Hong Kong order is excluded too. If the GBP simply has not converted yet, this is
        expected.</div>`):''}
      ${(hkdCash-(botHkd||0)-exCash)>=1000?`<div class="nm" style="padding:6px 0 2px;color:#ffb86b">
        ⚠ ${(hkdCash-(botHkd||0)-exCash).toLocaleString()} HKD is NOT earmarked, so the bot is sizing
        positions against it. Earmark it if it is passing through.</div>`:''}
      <div class="row" style="padding:8px 0 2px;gap:8px">
        <input id="ear-amt" type="number" inputmode="decimal" min="0" step="1" placeholder="HKD amount"
          style="flex:1;min-width:0;padding:8px 10px;border-radius:8px;color:inherit;font-size:15px;
                 border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06)">
        <button onclick="setEarmark()" style="padding:8px 16px;border-radius:8px;border:0;
          background:var(--green);color:#08210f;font-weight:800;font-size:14px">Set</button>
      </div>
      <div id="ear-msg" class="nm" style="font-size:11px;opacity:.75;padding-top:4px">
        Money passing through — a deposit waiting to be withdrawn. What you earmark is
        excluded from net worth AND from the pool the bot sizes against; what you do not is
        counted in both. Send 0 once it has left. Applies within ~10 minutes.</div>
    </div>`:'';
  const SORTS=[['new','Newest'],['old','Oldest'],['pnl','Best P&L'],['pnl_low','Worst P&L']];
  const sortHtml=rows.length?`<div class="row" style="padding:2px 0 0;gap:6px;flex-wrap:wrap">`
    +SORTS.map(([k,lab])=>`<button onclick="setPosSort('${k}')" style="padding:5px 10px;border-radius:999px;
       font-size:12px;font-weight:700;border:1px solid ${posSort()===k?'var(--green)':'rgba(255,255,255,.18)'};
       background:${posSort()===k?'rgba(41,208,134,.16)':'transparent'};
       color:${posSort()===k?'var(--green)':'inherit'}">${lab}</button>`).join('')
    +`</div>`:'';
  el.innerHTML=staleNote+botNote+`<div id="bench-card"></div>`+cashHtml+earHtml
    +`<div class="sec-h">Investment positions</div>`+sortHtml+
    (rows.length? rows.map(x=>{
      const last=x._last;
      const pnl=x._pnl;
      const amt=(last&&x.entry&&x.qty)?Math.round((last-x.entry)*x.qty*100)/100:null;
      const cls=(pnl||0)>=0?'pnl-pos':'pnl-neg';
      // Dividends received on the lot still held. The P&L above is the price
      // move only - IB's own figure - so on an ex-date it reads as a loss while
      // the dividend that caused the drop appears nowhere. Shown beside it, in
      // the position's own currency, with the total they make together.
      const dv=x.src==='bot'?lotDividends(x):null;
      const tot=(dv&&amt!=null)?Math.round((amt+dv.net)*100)/100:null;
      // Tapping the card opens its chart. The buttons inside it (Sell, Remove)
      // must keep working, so a tap that lands on one is left alone.
      return `<div class="card tap-card" onclick="if(!event.target.closest('button'))posSheet('${x.sym}')"
        ><div class="row"><div><div class="sym">${x.sym} <span class="pill"${x.src==='bot'?' style="background:rgba(41,208,134,.18);color:var(--green)"':''}>${x.src==='bot'?'🤖 AUTO':x.sleeve||''}</span>${x.qty?` <span class="pill">qty ${x.qty}</span>`:''}</div>
        <div class="nm">${x.name||''}</div></div><div style="text-align:right"><div class="${cls}" style="font-weight:700">${pnl==null?'':(pnl>0?'+':'')+pnl+'%'}</div>${amt!=null?`<div class="nm ${cls}">${amt>0?'+':''}${amt}</div>`:''}</div></div>
        ${dv?`<div class="row" style="padding:4px 0 0"><span class="nm">\ud83d\udcb0 Dividends received
            ${dv.n>1?'('+dv.n+')':''}</span>
          <span class="nm"><b class="pnl-pos">+${dv.net.toFixed(2)}</b>
            ${tot!=null?' \u00b7 total <b class="'+(tot>=0?'pnl-pos':'pnl-neg')+'">'
              +(tot>0?'+':'')+tot+'</b>':''}</span></div>`:''}
        <!-- The price the SIGNAL proposed and the price actually PAID are different
             numbers and both matter: the gap between them is the execution, and it
             runs to -1.7% on this book (LLY signalled 1149.36, paid 1129.66).
             The paid price is IB's own cost basis; the signal price is what the
             engine proposed, carried on the row as sig_entry.
             Only shown as two tiles when they actually differ. -->
        <div class="levels">
        ${x.sig_entry!=null&&x.entry!=null&&Math.abs(x.sig_entry-x.entry)>1e-9
          ?`<div class="lv"><span>Signal</span><b>${money(x.sig_entry)}</b></div>`:''}
        <div class="lv"><span>${(x.sig_entry!=null&&x.entry!=null)?'You paid':'Entry'} ${x.entry_date||x.since||''}</span>
          <b>${money(x.entry)}${(x.sig_entry&&x.entry&&Math.abs(x.sig_entry-x.entry)>1e-9)
            ?` <span class="nm" style="font-size:10px;font-weight:600">${(x.entry/x.sig_entry-1)*100>0?'+':''}${((x.entry/x.sig_entry-1)*100).toFixed(1)}%</span>`
            :''}</b></div>
        <div class="lv"><span>Last</span><b>${money(last)}</b></div>
        <!-- The BOT has no price target: engine_rr replaced the fixed target with a
             chandelier trailing stop ("let winners run"), ib_bot has no take-profit
             exit, and no bot position carries the field - so this row was permanently
             blank on all 14 of them. A position recorded on the PHONE does carry one
             (recordBuy stores the signal card's target), so it still gets the row.
             Everything else shows the cut-loss, which is what actually sells it. -->
        ${x.target!=null?`<div class="lv t"><span>Target</span><b>${money(x.target)}</b></div>`:''}
        <div class="lv s"><span>Cut-loss</span><b>${money(x.stop)}</b></div>
        <!-- How far price can FALL before the cut-loss, as a share of the price
             itself. Dividing by the stop instead overstates the cushion. -->
        ${x.target!=null?'':`<div class="lv"><span>To cut-loss</span><b>${(last!=null&&x.stop)
          ? ((1-x.stop/last)*100).toFixed(1)+'%' : '—'}</b></div>`}</div>
        <div class="pos-alert" data-sym="${x.sym}" data-last="${last==null?'':last}" data-entry="${x.entry||''}" data-sig-entry="${x.sig_entry==null?'':x.sig_entry}" data-stop="${x.stop==null?'':x.stop}"></div>
        ${x.src==='local'?`<div class="btn-row">
          <button class="btn-sm btn-sell" data-sym="${x.sym}" onclick="recordSell(this.dataset.sym)">Record sell</button>
          <button class="btn-sm" data-sym="${x.sym}" onclick="delPos(this.dataset.sym)">✕ Remove</button>
        </div>`:''}
        ${x.src==='bot'?`<div class="btn-row">
          <button class="btn-sm btn-sell" data-sym="${x.sym}" data-qty="${x.qty||0}"
            onclick="sendSell(this.dataset.sym,this.dataset.qty)">Sell on IB 🤖</button>
        </div>`:''}</div>`;
    }).join('') : `<div class="muted">No open positions yet.<br><br>After you buy a signal, tap its green
      <b>BUY</b> box on the Actions tab — the position appears here with live P&L,
      and its target/cut-loss are tracked for you. (Stored on this device.)</div>`);
  if(rows.length){
    el.innerHTML += `<div class="btn-row" style="margin-top:4px">
      <button class="btn-sm" onclick="exportPos()">Export backup</button>
      <button class="btn-sm" onclick="importPos()">Import</button></div>`;
  }
  loadBench();                       // "vs S&P 500" card under Account net worth
  // async: fill exit alerts from each product's latest engine state
  document.querySelectorAll('.pos-alert').forEach(async d=>{
    const a=await exitAlert({sym:d.dataset.sym, entry:parseFloat(d.dataset.entry)||null,
                             sig_entry:parseFloat(d.dataset.sigEntry)||null,
                             stop:d.dataset.stop===''?null:parseFloat(d.dataset.stop)},
                            d.dataset.last===''?null:parseFloat(d.dataset.last));
    if(a) d.innerHTML=`<div class="nm" style="margin-top:8px;padding:8px 10px;border-radius:10px;
      ${a.level==='sell'?'background:rgba(255,107,107,.12);color:var(--red);border:1px solid rgba(255,107,107,.4)'
        :'background:rgba(255,193,77,.10);color:var(--amber);border:1px solid rgba(255,193,77,.35)'};
      font-weight:600">${a.msg}</div>`;
  });
}
function exportPos(){
  const data=JSON.stringify({positions:lsGet('mps_positions'),history:lsGet('mps_history')});
  prompt('Copy this backup text (positions + history):', data);
}
function importPos(){
  const t=prompt('Paste a backup text to restore positions + history:');
  if(!t)return;
  try{const d=JSON.parse(t);
    if(d.positions)lsSet('mps_positions',d.positions);
    if(d.history)lsSet('mps_history',d.history);
    renderPositions();renderHistory();alert('Restored.');
  }catch(e){alert('Invalid backup text.');}
}

// ---- History: reconcile bot orders against the fills ledger ----
// The activity log records what IB said at the moment of PLACING, and a DAY
// order placed before its market opens is only ever "sent" at that moment -
// so History could never say whether CRL's 8-share sell on 2026-09-10 traded
// (it did: 7 + 1 at 276.01). The fills ledger can. Each fill is credited to the
// most recent live order for that symbol and side placed before it and within
// five days - MOST RECENT, because an expired DAY order that was re-placed must
// not steal its replacement's fill. Only ever upgrades a row; a fill that is
// not found changes nothing.
const FILLS_URL='https://raw.githubusercontent.com/btctree/multi-product-signals/main/data/fills_ledger.jsonl';
let FILLS=null, FILLS_LOADING=false;
async function loadFills(){
  // A failed or garbled fetch keeps the ledger we already have: wiping it to []
  // would silently drop every FILLED badge back to SENT until the next poll.
  // [] only on a first attempt that fails, so a render can never refetch-loop.
  try{
    const r=await fetch(FILLS_URL+'?t='+Date.now());
    if(r.ok){
      const got=(await r.text()).split(String.fromCharCode(10)).filter(l=>l.trim())
        .map(l=>{try{return JSON.parse(l)}catch(e){return null}}).filter(Boolean);
      if(got.length||FILLS===null) FILLS=got;
    }else if(FILLS===null) FILLS=[];
  }catch(e){ if(FILLS===null) FILLS=[]; }
}
// Called with every bot-state load, so a page left open - or pulled to refresh
// to see whether an order traded - reconciles against the CURRENT ledger. It
// draws first with the ledger it has and redraws when the fresh one lands, so
// rows never blink back to SENT in between.
async function refreshFills(){
  if(FILLS_LOADING) return;
  FILLS_LOADING=true;
  try{ await loadFills(); } finally { FILLS_LOADING=false; }
  if(HISTMODE==='activity') renderHistory();
}
function reconcileFills(act){
  const out=new Map();
  if(!FILLS||!FILLS.length) return out;
  const tAct=v=>Date.parse(String(v).replace(' UTC','Z').replace(' ','T'));
  const tFill=v=>Date.parse(String(v).replace(' ','T')+'Z');
  const rows=act.map((x,i)=>({x,i,ts:tAct(x.time),need:+x.qty||0,got:0,val:0}))
    .filter(r=>(r.x.action==='BUY'||r.x.action==='SELL')&&r.x.status!=='REJECTED'&&isFinite(r.ts)&&r.need>0);
  // source 'estimate' rows are SEEDS - pre-coverage holdings reconstructed from
  // IB average cost, not executions. Crediting an order with one would print an
  // estimated price as a fill price. Hand-entered 'manual' rows are real fills.
  const fills=FILLS.filter(f=>f.sec_type!=='CASH'&&f.source!=='estimate'&&(f.side==='BOT'||f.side==='SLD'))
    .map(f=>({f,ts:tFill(f.ts)})).filter(o=>isFinite(o.ts)).sort((a,b)=>a.ts-b.ts);
  const W=5*864e5, SLACK=36e5;          // 5-day window; 1h slack for hand-entered times
  for(const {f,ts} of fills){
    const side=f.side==='BOT'?'BUY':'SELL';
    let q=+f.qty||0;
    while(q>1e-9){
      const c=rows.filter(r=>r.x.symbol===f.symbol&&r.x.action===side&&r.ts<=ts+SLACK
                          &&ts-r.ts<=W&&r.got<r.need-1e-9);
      if(!c.length) break;
      // Prefer a real order. A manual row can merely RE-RECORD another order's
      // fill - publish_web's NTAP row reads "order 2026-08-21; filled at Monday
      // open" - and being more recent it took that fill, leaving the order that
      // actually traded at SENT. But the hand-placed JBHT and URI rows ARE the
      // orders, so a manual row still wins when nothing else is eligible.
      const live=c.filter(o=>!o.x.manual), pool=live.length?live:c;
      const r=pool.reduce((a,b)=>b.ts>a.ts?b:a);
      const take=Math.min(q,r.need-r.got);
      r.got+=take; r.val+=take*(+f.price||0); q-=take;
    }
  }
  rows.forEach(r=>{ if(r.got>0) out.set(r.i,{qty:Math.round(r.got*10000)/10000,px:r.val/r.got,full:r.got>=r.need-1e-9}); });
  return out;
}

// ---------- "vs S&P 500": is the bot beating buy-and-hold? ----------
// Two lines from the same days, both starting at 0%: this account's
// TIME-WEIGHTED growth and SPY's price return. Time-weighted means each day's
// return is measured against the capital actually at work that day, then the
// days are chained - the only way a deposit or withdrawal cannot masquerade as
// performance. Raw first-vs-last is not comparable to an index: the 2026-08-02
// withdrawal of 32,000 alone turns a +8.7% run into +4.5%.
// SPY (the S&P 500 tracker) is used because its card is already published for
// the Search tab, so this needs no new data anywhere.
let BENCH=null, BENCH_WIN=0, BENCH_BUSY=false, benchChart=null;
const BENCH_SYM='SPY';
// Honest provenance for the green line: the bot has placed its own orders since
// the first day plotted (fills_ledger source=api from 2026-07-20). The only
// exceptions are three trades entered by hand during the 24-26 Aug outage.
const BENCH_NOTE='The bot has placed every order itself since 2026-07-20, apart from '
  +'three entered by hand during the 24-26 Aug gateway outage.';
// The last date both sides can be final for, given when the price file was built.
// A stamp from a LATER day is past that day's close by construction; a stamp from
// the same day only counts after 21:00Z (16:00 EST / 17:00 EDT).
function benchSettled(genAt){
  const m=/^(\d{4}-\d{2}-\d{2})T(\d{2}):/.exec(String(genAt||''));
  if(!m) return null;                       // no stamp: plot what we have
  if(+m[2]>=21) return m[1];
  return new Date(Date.parse(m[1]+'T00:00:00Z')-864e5).toISOString().slice(0,10);
}
// Only the history file (about 3 KB) - never SPY.json, which changes hourly at
// most and weighs 26 KB. The replacement BENCH carries no stale flag, so this
// cannot loop; on a dropped connection the snapshot already shown stays.
async function refreshBenchHist(){
  BENCH_BUSY=true;
  try{
    const r=await fetch('https://raw.githubusercontent.com/btctree/multi-product-signals/main/data/netliq_history.json?t='+Date.now());
    if(r.ok){
      const h=await r.json();
      if(BENCH&&BENCH.bench){ CAL=h; BENCH={hist:h, bench:BENCH.bench}; renderBench(); }
    }
  }catch(e){}
  BENCH_BUSY=false;
}
async function loadBench(){
  if(!$('#bench-card')) return;
  if(BENCH&&!BENCH.err){                             // an error is never cached:
    renderBench();                                   // draw what we have first,
    if(BENCH.stale&&!BENCH_BUSY) refreshBenchHist(); // then catch the history up
    return;
  }
  if(BENCH&&BENCH.err) BENCH=null;                  // a dropped connection retries
  if(BENCH_BUSY) return;
  BENCH_BUSY=true;
  try{
    // two origins, so fire both and wait once: sequential awaits cost a full
    // extra round trip on mobile data, all of it spent with the slot empty
    const hist=CAL ? Promise.resolve(CAL) : (async()=>{
      let r=await fetch('https://raw.githubusercontent.com/btctree/multi-product-signals/main/data/netliq_history.json?t='+Date.now());
      if(!r.ok) r=await fetch('netliq_history.json');      // local-preview fallback
      return r.json();
    })();
    const bench=fetch('products/'+safe(BENCH_SYM)+'.json?t='+Date.now()).then(r=>r.json());
    const [h,b]=await Promise.all([hist,bench]);
    CAL=h; BENCH={hist:h, bench:b};
  }catch(e){ BENCH={err:true}; }
  BENCH_BUSY=false;
  renderBench();
}
function benchWin(n){ BENCH_WIN=n; renderBench(); }
// Pure: (our daily NetLiq, cash flows, benchmark closes, window) -> both curves.
// Kept free of the DOM so it can be checked on its own.
function benchCompute(series, flows, closes, days, genAt){
  const spy=new Map(closes||[]), fl=(flows||[]).slice();
  const s=(series||[]).slice().sort((a,b)=>a.d<b.d?-1:(a.d>b.d?1:0));
  // Earmarked cash ("exc") takes NO part in this arithmetic (board review
  // 2026-09-21, reversing 8b214e2). Both publishers already write NetLiq NET
  // of the earmark, and the owner's routine - a monthly GBP deposit converted
  // to HKD and earmarked the same day, withdrawn early the next month, neither
  // leg entered in flows - never moves that net figure. Adding the day's change
  // in "exc" back as if it were a flow painted the deposit as a gain and the
  // withdrawal as a loss. exc stays published beside nl; it is simply not P&L.
  let pts=s.filter(r=>spy.has(r.d)&&typeof r.nl==='number'&&r.nl>0)
           .map(r=>({d:r.d, nl:r.nl, px:spy.get(r.d)}));   // days BOTH recorded
  // ...and both FINISHED. The dashboard build runs hourly and Yahoo fills the
  // in-progress bar with the live price, while NetLiq is republished every ~20
  // minutes from an unrelated clock: mid-session the two sides of the newest day
  // are minutes-to-an-hour apart, which on a gap-down morning reads as a lead the
  // account has not earned. The build stamp settles it - 21:00Z is past the US
  // close in BOTH daylight and standard time, so no DST hazard and no hardcoded
  // exchange calendar.
  const settled=benchSettled(genAt);
  if(settled) pts=pts.filter(pt=>pt.d<=settled);
  const full=pts.length;
  let short=false;
  if(days>0&&pts.length){
    const cut=new Date(Date.parse(pts[pts.length-1].d+'T00:00:00Z')-days*864e5)
      .toISOString().slice(0,10);
    const win=pts.filter(p=>p.d>=cut);
    if(win.length>=2) pts=win; else short=true;   // told to the reader, not hidden
  }
  if(pts.length<2) return null;
  const flowIn=(from,to)=>fl.reduce((a,f)=>a+((f.d>from&&f.d<=to)?(f.amt||0):0),0);
  const out={labels:[pts[0].d], you:[0], bench:[0], youDD:0, benchDD:0,
             flows:0, inAmt:0, outAmt:0, moves:0,
             from:pts[0].d, to:pts[pts.length-1].d, days:pts.length,
             short:short, fullDays:full, settled:settled};
  let idx=1, peak=1, bpeak=1;
  for(let i=1;i<pts.length;i++){
    const f=flowIn(pts[i-1].d, pts[i].d);
    const base=pts[i-1].nl+f;
    if(base>0) idx*=pts[i].nl/base;            // money in or out is not profit
    const b=pts[i].px/pts[0].px;
    peak=Math.max(peak,idx); bpeak=Math.max(bpeak,b);
    out.youDD=Math.min(out.youDD, idx/peak-1);
    out.benchDD=Math.min(out.benchDD, b/bpeak-1);
    out.flows+=f;
    if(f>0){ out.inAmt+=f; out.moves++; } else if(f<0){ out.outAmt+=f; out.moves++; }
    out.labels.push(pts[i].d); out.you.push((idx-1)*100); out.bench.push((b-1)*100);
  }
  out.youEnd=out.you[out.you.length-1];
  out.benchEnd=out.bench[out.bench.length-1];
  // cash profit over the window: what the account gained once money in and
  // money out are removed (earmarked cash is already outside every nl)
  out.profit=Math.round(pts[pts.length-1].nl-pts[0].nl-out.flows);
  return out;
}
// ACCOUNT-ONLY figures, measured to NOW.
// Everything else on the vs-S&P card waits for a day both sides have CLOSED,
// because comparing a live account against yesterday's S&P is not a comparison.
// But profit, and this account's own worst dip, involve no S&P at all - so
// holding them to the settled window froze them for no reason: on a Monday
// afternoon the card still read Friday's figures while net worth, directly
// above it, had moved. These run over the account's OWN series, every day of
// it, through the live NetLiq the net-worth card shows - so the two agree, and
// they refresh with it every five minutes without fetching anything new.
// Same arithmetic as benchCompute: time-weighted, flows out, and no earmark
// term - the live NetLiq is net of the earmark exactly as the history is.
function acctToNow(series, flows, fromD, live){
  const s=(series||[]).filter(r=>r.d>=fromD&&typeof r.nl==='number'&&r.nl>0)
    .sort((a,b)=>a.d<b.d?-1:(a.d>b.d?1:0));
  if(live&&typeof live.nl==='number'&&live.nl>0){
    while(s.length&&s[s.length-1].d>=live.d) s.pop();   // live replaces today
    s.push({d:live.d, nl:live.nl});
  }
  if(s.length<2) return null;
  const fl=flows||[];
  const flowIn=(a,b)=>fl.reduce((t,f)=>t+((f.d>a&&f.d<=b)?(f.amt||0):0),0);
  let idx=1, peak=1, dd=0, fsum=0;
  for(let i=1;i<s.length;i++){
    const f=flowIn(s[i-1].d, s[i].d);
    const base=s[i-1].nl+f;
    if(base>0) idx*=s[i].nl/base;
    peak=Math.max(peak,idx); dd=Math.min(dd, idx/peak-1);
    fsum+=f;
  }
  const a=s[0], z=s[s.length-1];
  return {profit:Math.round(z.nl-a.nl-fsum), dd:dd, to:z.d};
}
function renderBench(){
  const el=$('#bench-card'); if(!el) return;
  if(!BENCH){ el.innerHTML=''; return; }
  if(BENCH.err){ el.innerHTML=`<div class="card" style="padding:10px 14px;margin-bottom:10px">
    <div class="nm">vs S&P 500 — could not load the history.</div></div>`; return; }
  const r=benchCompute((BENCH.hist||{}).series, (BENCH.hist||{}).flows,
                       (BENCH.bench||{}).prices, BENCH_WIN, (BENCH.bench||{}).generated_at);

  // BOT is re-fetched every five minutes; the S&P side only moves once a day
  const live=(BOT&&typeof BOT.netliq==='number')
    ? {d:new Date().toISOString().slice(0,10), nl:BOT.netliq}
    : null;
  const acct=acctToNow((BENCH.hist||{}).series, (BENCH.hist||{}).flows, r.from, live);
  const prof=acct?acct.profit:r.profit, myDD=acct?acct.dd:r.youDD;
  // engine/build_dashboard.py publishes only the last 500 sessions of prices, so
  // once this account is older than ~2 years the longest window starts at the
  // benchmark's floor, not at day one. Say so rather than let "All" quietly mean
  // "trailing two years".
  const ser0=((((BENCH.hist||{}).series||[])[0])||{}).d;
  const spy0=(((((BENCH.bench||{}).prices||[])[0])||[])[0]);
  const clip=!!(ser0&&spy0&&ser0<spy0);
  const btn=(n,lab)=>`<button class="btn-sm" style="padding:3px 9px;font-size:11px;${BENCH_WIN===n
    ?'background:rgba(77,155,255,.20);color:var(--blue)':''}" onclick="benchWin(${n})">${lab}</button>`;
  el.innerHTML=`<div class="card" style="padding:12px 14px;margin-bottom:10px">
    <div class="row" style="align-items:center"><span class="nm">📈 Growth vs S&P 500</span>

    <div class="row" style="padding:8px 0 2px">
      <div><div class="nm">This account</div>
        <b class="${r.youEnd>=0?'pnl-pos':'pnl-neg'}" style="font-size:19px">${sign(r.youEnd)}</b></div>
      <div style="text-align:center"><div class="nm">S&P 500</div>
        <b class="${r.benchEnd>=0?'pnl-pos':'pnl-neg'}" style="font-size:19px">${sign(r.benchEnd)}</b></div>
      <div style="text-align:right"><div class="nm">${gap>=0?'Ahead by':'Behind by'}</div>
        <b class="${gap>=0?'pnl-pos':'pnl-neg'}" style="font-size:19px">${sign(Math.abs(gap)).replace('+','')}</b></div>
    </div>
    <!-- no height here on purpose: a global rule forces canvas{height:220px !important},
         so a shorter wrapper lets the x-axis labels spill over the rows below. -->
    <div class="chart-wrap" style="margin:6px 0 4px"><canvas id="bench-cv"></canvas></div>
    <div class="row" style="padding:2px 0"><span class="nm">Profit after money in/out
        <span style="font-size:10px;opacity:.7">${acct?'\u00b7 live':''}</span></span>
      <b class="${prof>=0?'pnl-pos':'pnl-neg'}">${prof>=0?'+':''}${prof.toLocaleString()} HKD</b></div>
    <!-- Two rows, not one. Your own dip runs live; the comparison with the S&P
         must cover the SAME dates, or it can flip the verdict: both falling 5%

    <div class="row" style="padding:2px 0"><span class="nm">Your worst dip

      <b>${(myDD*100).toFixed(1)}%</b></div>
    <div class="row" style="padding:2px 0"><span class="nm">Worst dip to ${r.to}</span>
      <b>you ${(r.youDD*100).toFixed(1)}% \u00b7 S&P ${(r.benchDD*100).toFixed(1)}%</b></div>
    <div class="nm" style="font-size:11px;opacity:.75;padding-top:6px">

      ${acct?'Profit and \u201cyour worst dip\u201d are yours alone, so they run to now, from the '

        +'is set. Anything compared with the S&P covers the same days on both sides.':''}
      ${r.days} days both traded · both lines start at 0%.
      ${r.short?'There were not enough days in that window yet, so this is the whole history.':''}
      ${clip&&!BENCH_WIN?'The S&P file only goes back to '+spy0+', so this starts there and not at your first day ('+ser0+').':''}

          +(r.inAmt?'+'+r.inAmt.toLocaleString()+' HKD paid in':'')
          +(r.inAmt&&r.outAmt?' and the ':'')

      ${BENCH_NOTE} SPY's prices are dividend-adjusted, so the grey line already

async function loadCal(){

// Net dividends (after withholding tax) on the lot still held - from its entry
// date on, so a dividend earned on an earlier, sold lot is not credited to this
// one. Needs both ledgers; until they have loaded the card simply shows none,
// and the first load re-renders it.
function lotDividends(x){
  if(!DIVS||!DIVS.length) return null;
  const from=entryDateOf(x.sym);
  if(!from) return null;                        // no entry date: claim nothing
  const ib=(BOT&&BOT.positions||[]).find(p=>p.symbol===x.sym);
  const names=new Set([x.sym, ib&&ib.ib_symbol].filter(Boolean).map(String));
  // Partly sold since it was bought (WST went 25 -> 5 shares): the ledger
  // cannot say how much of each payment belongs to the shares still held, and
  // crediting all 25 shares' dividends beside the price move of 5 overstates
  // the total. Claim nothing, the same answer as a missing entry date. A sale
  // that took the position flat moved the entry date past it, so only a trim
  // lands here. Board review 2026-09-21.
  if((FILLS||[]).some(f=>names.has(String(f.symbol))&&f.sec_type!=='CASH'&&f.side==='SLD'
                         &&String(f.date||'').slice(0,10)>=from)) return null;
  const mine=DIVS.filter(r=>names.has(String(r.symbol)));
  // Entitlement is fixed on the EX-date, weeks before the pay date the row is
  // dated by (~3 months for a Japanese year-end dividend). A lot bought ON or
  // after the ex-date is not entitled - the dividend belongs to the lot sold
