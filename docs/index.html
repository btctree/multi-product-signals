  // Only a crossing INSIDE the drawn window is marked on the line, so an older
  // one is named as what it is rather than pointed at a dot that is not there.
  const lastCross=f.cross.filter(c=>c.i>=from).slice(-1)[0]||null;
  const olderCross=lastCross?null:(f.cross.slice(-1)[0]||null);
  const bars=lastCross?(f.last-lastCross.i):null;
  // How the cut-loss on the card was reached. Only claimed when recomputing it
  // from the published price and ATR lands on the published number; otherwise
  // the sheet says where it came from instead of inventing a formula.
  let stopBox='';
  if(card.stop!=null){
    const k=crypto?SIG_RULES.crypto_trail:SIG_RULES.K;
    // The stop was measured off the close on THIS card, which is the last close
    // of the chart in every normal case and an older one only when the card
    // predates the newest build (the note above says so when it does).
    const base=(card.price!=null)?+card.price:f.price;
    const byAtr=(atr!=null)?(base-k*atr):null;
    const byPct=crypto?null:base*(1-SIG_RULES.hard_stop_pct);
    const mine=(byAtr==null)?null:(byPct==null?byAtr:Math.max(byAtr,byPct));
    // The engine issues a trade stop ONLY together with an entry; on a WATCH or
    // AVOID card the "stop" field carries the 200-day line instead. Deciding by
    // arithmetic alone claimed an ATR stop on 16 published cards where the two
    // happened to land within a cent of each other (board review 2026-09-23).
    const hasTradeStop=card.entry!=null;
    const matches=hasTradeStop&&(mine!=null)&&Math.abs(mine-card.stop)<=SIG_TOL;
    const isSma=!hasTradeStop&&(card.sma200!=null)&&Math.abs(card.stop-card.sma200)<=SIG_TOL;
    stopBox='<div class="card" style="padding:9px 12px;margin:8px 0 0;background:rgba(229,72,77,.07)">'
      +'<div class="nm" style="font-weight:700;color:#ff8a80">Cut-loss '+m2(card.stop)+'</div>';
    if(matches){
      stopBox+='<div class="nm" style="margin-top:4px">Close '+m2(base)
        +' − '+k+' × ATR(14) '+m2(atr)+' = <b>'+m2(byAtr)+'</b></div>'
        +(byPct!=null?'<div class="nm">Floor, never more than '
          +(SIG_RULES.hard_stop_pct*100)+'% below: <b>'+m2(byPct)+'</b></div>'
          +'<div class="nm">The engine takes the higher of the two → <b>'+m2(card.stop)+'</b>'
          +(byAtr>=byPct?' (the ATR distance)':' (the floor)')+'</div>':'')
        +'<div class="nm" style="margin-top:4px;opacity:.8">'
        +(crypto?'A chandelier trail: it follows the high water mark up, never down.'
                :'This is the resting catastrophe stop at entry. Once held, the bot '
                 +'trails it up behind the high water mark and never lowers it.')
        +'</div>';
    }else if(isSma){
      stopBox+='<div class="nm" style="margin-top:4px">Not a trade stop: it is the '
        +'200-day average ('+m2(card.sma200)+'), the line that decides the regime. '
        +(vs200!=null&&vs200<0
          ?'Price is below it, so the engine stands aside until it is reclaimed.'
          :'A close below it is what would take the engine out of this product.')
        +'</div>';
    }else{
      stopBox+='<div class="nm" style="margin-top:4px">As published by the build for '
        +'this card. The sheet only spells out the arithmetic when it can reproduce '
        +'the number from the published close and ATR.</div>';
    }
    stopBox+='</div>';
  }
  const rules=crypto
    ? sigRow(f.sma200!=null?f.price>f.sma200:null,'Above its 200-day average',
             m2(f.price)+' vs '+m2(f.sma200)+(vs200!=null?' ('+pct(vs200)+')':''))
      +sigRow((f.sma50!=null&&f.sma200!=null)?f.sma50>f.sma200:null,
              '50-day above the 200-day', m2(f.sma50)+' vs '+m2(f.sma200))
      +(f.mom!=null?sigRow(null,'90-day momentum',pct(f.mom*100)):'')
    : sigRow(f.sma200!=null?f.price>f.sma200:null,'Above its 200-day average',
             m2(f.price)+' vs '+m2(f.sma200)+(vs200!=null?' ('+pct(vs200)+')':''))
      +sigRow((f.sma50!=null&&f.sma200!=null)?f.sma50>f.sma200:null,
              '50-day above the 200-day (trend confirmed)', m2(f.sma50)+' vs '+m2(f.sma200))
      +sigRow(f.rsiNow!=null?f.rsiNow<SIG_RULES.rsi_entry:null,
              'Oversold dip: RSI(3) under '+SIG_RULES.rsi_entry, f.rsiNow==null?'—':f.rsiNow.toFixed(0))
      +(f.mom!=null?sigRow(f.mom>SIG_RULES.min_mom,'90-day momentum over +'
              +(SIG_RULES.min_mom*100)+'%', pct(f.mom*100)
              +(card.score!=null?' · score '+card.score+' (gate '+SIG_RULES.gate+')':'')):'')
      +(offHi!=null?sigRow(f.price>=SIG_RULES.near_high*f.hi52,'Within '
              +Math.round((1-SIG_RULES.near_high)*100)+'% of its 52-week high',
              pct(offHi)+' (high '+m2(f.hi52)+')'):'')
      +(atr!=null?sigRow(atr/f.price>SIG_RULES.min_atr_pct,'Daily range clears costs: ATR(14) over '
              +(SIG_RULES.min_atr_pct*100)+'% of price', (atr/f.price*100).toFixed(1)+'%'):'');
  // The engine stamps every product outside the validated strategy, so a BUY or
  // WATCH there is never read as a trade signal. Carry that stamp onto the sheet.
  const monitorNote=(card.tradeable===false)
    ? '<div class="card" style="padding:8px 12px;margin:6px 0 2px;background:rgba(255,193,77,.10)">'
      +'<div class="nm" style="color:#ffc14d">Analysis only — this product class is monitored, '
      +'not part of the validated trading strategy. The levels below are reference, not orders '
      +'the bot will place.</div></div>' : '';
  // A card rendered before the last rebuild can state a verdict the build has
  // since changed; the chart is always the newest data, so say when they differ.
  const moved=(fresh&&card&&fresh.action&&card.action&&fresh.action!==card.action)
    ? '<div class="card" style="padding:8px 12px;margin:6px 0 2px;background:rgba(77,155,255,.10)">'
      +'<div class="nm" style="color:#9ec5ff">This card was published as <b>'+escH(card.action)
      +'</b>. The latest build now reads <b>'+escH(fresh.action)+'</b> for '+escH(sym)
      +' — pull down on the list to refresh it. The chart below is the latest data.</div></div>' : '';
  el.innerHTML='<div class="sheet">'+head+monitorNote+moved
    +'<div class="row" style="padding:4px 0 2px"><div><div class="nm">'
      +escH(card.regime||'')+'</div><b style="font-size:17px">'+escH(card.action||'')+'</b></div>'
    +'<div style="text-align:right"><div class="nm">Last close '+escH(f.d[f.last])+'</div>'
    +'<b style="font-size:17px">'+m2(f.price)+'</b></div></div>'
    +'<div class="chart-wrap" style="margin:6px 0 4px"><canvas id="sig-cv"></canvas></div>'
    +(lastCross?'<div class="nm" style="padding:0 0 6px">Price last crossed '
       +(lastCross.up?'<b class="pnl-pos">above</b>':'<b class="pnl-neg">below</b>')
       +' its 200-day average on <b>'+escH(lastCross.d)+'</b>'
       +(bars!=null?' — '+bars+' trading days ago':'')+'. Each crossing in the window is '
       +'marked on the line.</div>'
       :(olderCross?'<div class="nm" style="padding:0 0 6px">No crossing of the 200-day '
       +'average in the '+W+' sessions drawn here. The one before that was on <b>'
       +escH(olderCross.d)+'</b>, earlier than this chart starts.</div>'
       :'<div class="nm" style="padding:0 0 6px">No crossing of the 200-day average in '
       +'the published history.</div>'))
    +'<div class="sec-h" style="margin:2px 0 4px">What the engine measured</div>'
    +rules
    +(card.entry!=null?sigRow(null,'Entry (next open)',m2(card.entry)):'')
    +(card.target!=null?sigRow(null,'Informational target',m2(card.target)):'')
    +stopBox
    +'<div class="nm" style="font-size:11px;opacity:.75;padding-top:8px">'
    +'Closes are the published daily closes, adjusted for dividends and splits, and the '
    +'averages, RSI and momentum here are recomputed from them with the engine\'s own '
    +'formulas; ATR(14) comes from the build. A rule marked ✗ is why a card says WATCH or '
    +'AVOID instead of BUY. The engine acts at the NEXT open, so today\'s close is the '
    +'measurement, not the fill.</div></div>';
  drawSigChart(f, card, from, crypto);
}
async function drawSigChart(f, card, from, crypto){
  const ok=await loadChartLib(); const cv=$('#sig-cv'); if(!cv) return;
  if(!ok){ cv.parentElement.innerHTML='<div class="muted" style="padding:14px">'
    +'Chart needs an internet connection (Chart.js) — the figures below still work.</div>'; return; }
  if(SIG_CHART){ try{SIG_CHART.destroy()}catch(e){} }
  const labels=f.d.slice(from), close=f.px.slice(from);
  const s200=f.s200.slice(from), s50=f.s50.slice(from);
  // Crossings as a scatter on top of the price line: the moment the trend gate
  // changed its answer.
  const marks=labels.map((d,i)=>{
    const c=f.cross.find(c=>c.i===from+i); return c?close[i]:null; });
  const flat=(v,color)=>({data:labels.map(()=>v), borderColor:color, borderWidth:1.2,
                          pointRadius:0, borderDash:[2,3]});
  const ds=[
    {label:'Price', data:close, borderColor:'#29d086', borderWidth:2.2, pointRadius:0, tension:.15},
    {label:'200-day average', data:s200, borderColor:'#93a4c0', borderWidth:1.4,
     borderDash:[5,4], pointRadius:0, tension:.15, spanGaps:true},
    {label:'50-day average', data:s50, borderColor:'#ffc14d', borderWidth:1.2,
     pointRadius:0, tension:.15, spanGaps:true},
    {label:'Crossed the 200-day', data:marks, borderColor:'transparent',
     backgroundColor:'#4d9bff', pointRadius:4, showLine:false, spanGaps:false},
  ];
  if(card&&card.stop!=null) ds.push(Object.assign({label:'Cut-loss'}, flat(+card.stop,'#e5484d')));
  if(card&&card.entry!=null) ds.push(Object.assign({label:'Entry'}, flat(+card.entry,'#4d9bff')));
  if(card&&card.target!=null) ds.push(Object.assign({label:'Target'}, flat(+card.target,'#29d086')));
  SIG_CHART=new Chart(cv,{type:'line',data:{labels:labels,datasets:ds},
    options:{responsive:true,maintainAspectRatio:false,interaction:{intersect:false,mode:'index'},
      plugins:{legend:{labels:{color:'#93a4c0',boxWidth:12,font:{size:10}}}},
      scales:{x:{ticks:{color:'#5f6f8c',maxTicksLimit:5,font:{size:10},
          callback:(v,i)=>{const d=labels[i]||''; if(!d) return '';
            const M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
            // "Sep '26" - a YEAR axis, unmistakable beside the holding chart's
            // "Sep 18", which is a day.
            const q=d.split('-'); return M[+q[1]-1]+" '"+q[0].slice(2);}},grid:{display:false}},
        y:{ticks:{color:'#5f6f8c',font:{size:10}},grid:{color:'#1c2942'}}}}});
}

// ---------- tap a disposal: the whole trade, entry to exit ----------
// The tax card says what a sale earned; this says what the trade LOOKED like -
// the two averages the engine trades on, where it bought and sold, and the
// cut-loss walking up behind it until the exit (owner's request, 2026-09-25).
// Everything is published data: the product card's closes, the fills ledger,
// and data/stop_history.json. Nothing here is reconstructed from a rule.
let TRADE_KEY=null, TRADE_CHART=null;
// The tax report and the fills ledger both speak IB's symbol ("DBK", "5301"),
// while the price cards are named the way the rest of the site is ("DBK.DE",
// "5301.T"). Resolve through the published index, and only when it is certain.
function chartSymbolFor(sym){
  if(!sym) return null;
  if((IDX||[]).some(o=>o.sym===sym)) return sym;
  const hits=(IDX||[]).filter(o=>String(o.sym).split('.')[0]===sym);
  return hits.length===1?hits[0].sym:null;
}
function fillsFor(sym){
  const base=String(sym).split('.')[0];
  return (FILLS||[]).filter(f=>f.sec_type!=='CASH'&&(f.side==='BOT'||f.side==='SLD')
      &&(String(f.symbol)===String(sym)||String(f.symbol)===base))
    .sort((a,b)=>String(a.date)<String(b.date)?-1:1);
}
// The first buy of the lot this disposal ENDED (or of the lot still open on
// that day, for a partial sale). Walking to the sale and returning whatever is
// still open gives null exactly when the sale closed the lot - which is the
// normal case for a disposal - so the lot being closed is remembered.
function lotEntryBefore(sym, sold){
  let start=null, qty=0, closedOnSold=null;
  for(const f of fillsFor(sym)){
    const day=String(f.date).slice(0,10);
    if(day>sold) break;
    const q=Math.abs(+f.qty||0);
    if(f.side==='SLD'){
      qty-=q;
      if(qty<=1e-9){
        if(day===sold&&start) closedOnSold=start;   // this disposal's own lot
        qty=0; start=null;
      }
    }else{
      if(qty<=1e-9||!start) start=day;
      qty+=q;
    }
  }
  return start||closedOnSold;
}
function tradeSheet(sym, sold, gain){
  TRADE_KEY=sym+'|'+sold;
  renderTradeSheet(null, sym, sold, gain);
  loadTradeChart(sym, sold, gain);
}
function closeTradeSheet(ev){
  if(ev&&ev.target!==ev.currentTarget) return;
  TRADE_KEY=null;
  if(TRADE_CHART){ try{TRADE_CHART.destroy()}catch(e){} TRADE_CHART=null; }
  const el=$('#trade-sheet'); if(el) el.remove();
}
async function loadTradeChart(sym, sold, gain){
  const key=sym+'|'+sold;
  const chartSym=chartSymbolFor(sym);
  try{
    if(!chartSym) throw new Error('no price card for '+sym);
    const [r]=await Promise.all([fetch('products/'+safe(chartSym)+'.json?t='+Date.now()),
                                 FILLS===null?loadFills():null, loadStops()]);
    if(!r.ok) throw new Error('HTTP '+r.status);
    const p=await r.json();
    if(TRADE_KEY===key) renderTradeSheet(p, sym, sold, gain, chartSym);
  }catch(e){ if(TRADE_KEY===key) renderTradeSheet({err:String(e.message||e)}, sym, sold, gain); }
}
function renderTradeSheet(p, sym, sold, gain, chartSym){
  if(!TRADE_KEY) return;
  let el=$('#trade-sheet');
  if(!el){
    el=document.createElement('div');
    el.id='trade-sheet'; el.className='sheet-bg';
    el.setAttribute('onclick','closeTradeSheet(event)');
    document.body.appendChild(el);
  }
  const head='<div class="sheet-grip"></div>'
    +'<div class="row" style="align-items:flex-start">'
    +'<div><b style="font-size:17px">'+escH(sym)+'</b>'
    +'<div class="nm">sold '+escH(sold)+(gain!=null?' · '+fmtGBP(gain):'')+'</div></div>'
    +'<button class="btn-sm" onclick="closeTradeSheet()">Close</button></div>';
  if(!p){ el.innerHTML='<div class="sheet">'+head
      +'<div class="muted" style="padding:18px 0">Loading the chart…</div></div>'; return; }
  if(p.err||!p.prices||p.prices.length<2){
    el.innerHTML='<div class="sheet">'+head+'<div class="muted" style="padding:18px 0">'
      +'No published price history for this one'+(p.err?' ('+escH(p.err)+')':'')
      +'. Products leave the universe when they stop qualifying, and their cards go with them.'
      +'</div></div>'; return; }
  const px=p.prices.map(r=>+r[1]), ds=p.prices.map(r=>r[0]);
  const pub=new Map(p.sma200||[]);
  const s200=smaArr(px,200).map((v,i)=>pub.has(ds[i])?pub.get(ds[i]):v);
  const s50=smaArr(px,50), rsi=rsiArr(px,3);
  const at=dd=>{ let k=-1; for(let i=0;i<ds.length;i++){ if(ds[i]<=dd) k=i; else break; } return k; };
  const entry=lotEntryBefore(sym, sold);
  const ie=entry?at(entry):-1, ix=at(sold);
  // The card must actually cover the trade. A product that left the universe
  // keeps the card it had when it left, and charting that window would put a
  // month-old picture under a sale it does not contain.
  const gap=ix<0?null:Math.round((Date.parse(sold)-Date.parse(ds[ix]))/86400000);
  if(ix<0||gap>7){
    el.innerHTML='<div class="sheet">'+head+'<div class="muted" style="padding:18px 0">'
      +'The published price card '+(ix<0?'starts after this sale'
        :'stops at '+escH(ds[ix])+', '+gap+' days before it')
      +', so there is no chart of this trade. Cards are kept only while a product '
      +'is in the monitored universe.</div></div>';
    return;
  }
  // A little before the entry, so the dip the engine bought is visible, and a
  // little after the exit.
  const from=Math.max(0, (ie>=0?ie:ix-40)-20), to=Math.min(ds.length-1, ix+5);
  const labels=ds.slice(from,to+1), close=px.slice(from,to+1);
  const m2=v=>{ if(v==null) return '—'; const n=+v; if(!isFinite(n)) return '—';
    return n.toLocaleString(undefined,{maximumFractionDigits:Math.abs(n)>=1?2:6}); };
  const pct=v=>(v>0?'+':'')+v.toFixed(1)+'%';
  const momAt=i=>(i>=90&&px[i-90])?(px[i]/px[i-90]-1)*100:null;
  const row=(lab,val)=>'<div class="row" style="padding:3px 0"><span class="nm">'+lab
    +'</span><b>'+val+'</b></div>';
  const fills=fillsFor(sym).filter(f=>{ const d=String(f.date).slice(0,10);
    return (!entry||d>=entry)&&d<=sold; });
  const buys=fills.filter(f=>f.side==='BOT'), sells=fills.filter(f=>f.side==='SLD');
  const avg=a=>a.length?a.reduce((s,f)=>s+(+f.price||0)*Math.abs(+f.qty||0),0)
                       /a.reduce((s,f)=>s+Math.abs(+f.qty||0),0):null;
  const bp=avg(buys), sp=avg(sells);
  const held=(entry&&sold)?Math.round((Date.parse(sold)-Date.parse(entry))/86400000):null;
  // The cut-loss as it stood through the holding, from the published history.
  const stops=((STOPS&&STOPS[chartSym])||(STOPS&&STOPS[sym])||[])
    .filter(r=>(!entry||String(r[0])>=entry)&&String(r[0])<=sold);
  const stopLine=stops.length?labels.map(d=>{
    let v=null; for(const r of stops){ if(String(r[0])<=d) v=+r[1]; } return v; }):null;
  el.innerHTML='<div class="sheet">'+head
    +'<div class="row" style="padding:4px 0 2px"><div><div class="nm">'
      +(entry?'Bought '+escH(entry)+(held!=null?' · held '+held+' days':''):'Entry not in the fills ledger')
      +'</div><b style="font-size:17px">'+(bp!=null&&sp!=null
        ? m2(bp)+' → '+m2(sp)+' <span class="'+((sp>=bp)?'pnl-pos':'pnl-neg')+'">'
          +pct((sp/bp-1)*100)+'</span>'
        : 'Sold '+escH(sold))+'</b></div></div>'
    +'<div class="chart-wrap" style="margin:6px 0 4px"><canvas id="trade-cv"></canvas></div>'
    +'<div class="sec-h" style="margin:2px 0 4px">What the engine saw when it bought</div>'
    +(ie>=0
      ? row('Price vs its 200-day average', m2(px[ie])+' vs '+m2(s200[ie])
            +(s200[ie]?' ('+pct((px[ie]/s200[ie]-1)*100)+')':''))
        +row('50-day vs 200-day', m2(s50[ie])+' vs '+m2(s200[ie]))
        +row('RSI(3) on the signal close', rsi[ie]==null?'—':rsi[ie].toFixed(0))
        +(momAt(ie)!=null?row('90-day momentum', pct(momAt(ie))):'')
      : '<div class="nm">The entry is not in the published fills ledger, so the '
        +'window before the sale is shown instead.</div>')
    +'<div class="sec-h" style="margin:8px 0 4px">On the way out</div>'
    // A sale made today is ahead of the last published close, so the day is
    // named rather than called "the sale day".
    +row(ds[ix]===sold?'Close on the sale day'
                      :'Last published close before it ('+escH(ds[ix])+')', m2(px[ix]))
    +(s200[ix]?row('Price vs its 200-day average then', pct((px[ix]/s200[ix]-1)*100)):'')
    +(stops.length?row('Cut-loss in force', m2(stops[stops.length-1][1])
        +(stops.length>1?' <span class="nm">(raised '+(stops.length-1)+' time'
        +(stops.length===2?'':'s')+' while held)</span>':'')):'')
    +'<div class="nm" style="font-size:11px;opacity:.75;padding-top:8px">'
    +'The engine measures on the close and acts at the NEXT open, so the signal that '
    +'bought this was the close before the buy mark. Closes are adjusted for dividends '
    +'and splits, so they can differ from the fill prices, which are what you actually '
    +'paid and received'+(stops.length?'':'. No published cut-loss history covers this '
    +'trade — it starts 2026-07-20')+'.</div></div>';
  drawTradeChart(labels, close, s200.slice(from,to+1), s50.slice(from,to+1), stopLine,
                 buys, sells);
}
async function drawTradeChart(labels, close, s200, s50, stops, buys, sells){
  const ok=await loadChartLib(); const cv=$('#trade-cv'); if(!cv) return;
  if(!ok){ cv.parentElement.innerHTML='<div class="muted" style="padding:14px">'
    +'Chart needs an internet connection (Chart.js) — the figures below still work.</div>'; return; }
  if(TRADE_CHART){ try{TRADE_CHART.destroy()}catch(e){} }
  const mark=(list,useClose)=>labels.map((d,i)=>{
    const f=list.find(x=>String(x.date).slice(0,10)===d);
    return f?(+f.price||close[i]):null; });
  const ds=[
    {label:'Price', data:close, borderColor:'#29d086', borderWidth:2.2, pointRadius:0, tension:.15},
    {label:'200-day average', data:s200, borderColor:'#93a4c0', borderWidth:1.4,
     borderDash:[5,4], pointRadius:0, tension:.15, spanGaps:true},
    {label:'50-day average', data:s50, borderColor:'#ffc14d', borderWidth:1.2,
     pointRadius:0, tension:.15, spanGaps:true},
  ];
  if(stops) ds.push({label:'Cut-loss (as it moved)', data:stops, borderColor:'#e5484d',
                     borderWidth:1.4, pointRadius:0, stepped:'after', spanGaps:false});
  ds.push({label:'Bought', data:mark(buys), borderColor:'transparent',
           backgroundColor:'#29d086', pointRadius:6, pointStyle:'triangle',
           showLine:false, spanGaps:false});
  ds.push({label:'Sold', data:mark(sells), borderColor:'transparent',
           backgroundColor:'#e5484d', pointRadius:6, pointStyle:'rectRot',
           showLine:false, spanGaps:false});
  TRADE_CHART=new Chart(cv,{type:'line',data:{labels:labels,datasets:ds},
    options:{responsive:true,maintainAspectRatio:false,interaction:{intersect:false,mode:'index'},
      plugins:{legend:{labels:{color:'#93a4c0',boxWidth:12,font:{size:10}}}},
      scales:{x:{ticks:{color:'#5f6f8c',maxTicksLimit:5,font:{size:10},
          callback:(v,i)=>{const d=labels[i]||''; if(!d) return '';
            const M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
            const q=d.split('-'); return M[+q[1]-1]+' '+(+q[2]);}},grid:{display:false}},
        y:{ticks:{color:'#5f6f8c',font:{size:10}},grid:{color:'#1c2942'}}}}});
}

// ---------- "the app itself is out of date" ----------
// GitHub Pages serves this page with Cache-Control: max-age=600, and the app is
// installed to the Home Screen, so a deploy can sit unseen behind a cached copy
// while the owner looks straight at the old layout. Neither of the page's own
// refreshes helps: "Refresh now" and pull-to-refresh refetch the DATA, and the
// stale JavaScript that renders it keeps running. Worse, the symptom is
// invisible - the page looks fine, it is simply the previous version.
// So ask the server whether THIS document has changed, by its ETag, and offer a
// real reload when it has. HEAD only: headers, no body, same origin, so the
// ETag is readable and the check costs nothing.
// Compare the build stamp INSIDE the running document against the one the
// server is serving. Two things this must not do, both learned the hard way:
//   * It must not baseline against the server at startup. Doing that records
//     whatever the server has NOW as "my version", so a page already stale in
//     the cache looks current forever - which is precisely the case this
//     exists to catch, and precisely what happened on 2026-09-20.
//   * It must not use the ETag. GitHub Pages derives it from mtime and size,
//     and the site is rebuilt every hour, so an unchanged page would raise the
//     banner hourly until the owner learned to ignore it.
// The stamp is content-derived and checked by execution/test_commands.py, so
// index.html cannot change without it changing.
function appBuild(){
  const m=document.querySelector('meta[name="app-build"]');
  return m?m.getAttribute('content'):null;
}
async function serverBuild(){
  try{
    const r=await fetch('index.html',{cache:'no-store'});
    const t=await r.text();
    const m=/<meta name="app-build" content="([^"]*)"/.exec(t);
    return m?m[1]:null;
  }catch(e){ return null; }
}
async function checkAppVersion(){
  const mine=appBuild(), theirs=await serverBuild();
  if(!mine||!theirs) return;                        // offline, or no stamp
  if(mine===theirs) return;
  let el=$('#app-new');
  if(!el){
    el=document.createElement('div');
    el.id='app-new';
    el.style.cssText='position:fixed;left:12px;right:12px;bottom:calc(var(--nav-h) + '
      +'env(safe-area-inset-bottom) + 12px);z-index:55;background:var(--blue);'
      +'color:#04101f;font-weight:700;border-radius:12px;padding:11px 14px;'
      +'box-shadow:0 6px 24px rgba(0,0,0,.45);text-align:center';
    el.textContent='A newer version of this app is ready \u2014 tap to load it';
    el.onclick=()=>location.reload();
    document.body.appendChild(el);
  }
}
// ---------- what a day's P&L was MADE of (tap a day in the calendar) ----------
// The calendar says a Tuesday was -3,147 HKD. This says whether that was one
// position collapsing or fourteen drifting. data/day_parts.json carries, per
// day, every holding's value in HKD, the cash in each currency and the rate
// each was valued at; fills_ledger says what was traded. A position's day is
//    value today - value yesterday - what was paid to buy more + what a sale
//    brought in
// so buying 46 DBK never shows up as a 15,000 HKD "gain".
// Whatever the parts do not account for is shown as "unexplained" rather than
// smeared into the biggest mover: for reconstructed days that is mostly
// currency drift (their rates are one fitted constant), and for live days it is
// fees, dividends and the minutes between the two snapshots.
// DIVS_OK, not "DIVS is non-null", says the ledger really loaded: one failed
// fetch used to leave DIVS=[] for the rest of the session, hiding every card's
// dividends and booking each day's in "Unexplained" (board review 2026-09-21).
let PARTS=null, PARTS_BUSY=false, SHEET_D=null, DIVS=null, DIVS_OK=false;
const DIVS_URL='https://raw.githubusercontent.com/btctree/multi-product-signals/main/data/dividends_ledger.jsonl';
const PARTS_URL='https://raw.githubusercontent.com/btctree/multi-product-signals/main/data/day_parts.json';
const escH=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function loadParts(){
  if(PARTS&&!PARTS.err) return PARTS;
  if(PARTS_BUSY) return null;
  PARTS_BUSY=true;
  try{
    let r=await fetch(PARTS_URL+'?t='+Date.now());
    if(!r.ok) r=await fetch('day_parts.json');            // local-preview fallback
    PARTS=await r.json();
  }catch(e){ PARTS={err:true}; }
  PARTS_BUSY=false;
  return PARTS;
}
async function loadDivs(){
  if(DIVS_OK) return DIVS;
  try{
    const r=await fetch(DIVS_URL+'?t='+Date.now());
    // a 404/429 body is not a ledger: parsing it "succeeded" with no rows
    if(!r.ok) throw new Error('HTTP '+r.status);
    // Append-only and KEYED BY ID: a correction is a new line carrying the same
    // id (a rate a failed lookup left off, say). Summing every line counts that
    // payment twice, forever. Last line per id wins - the same rule
    // uk_cgt._load_dividends applies to this very file.
    const by=new Map();
    (await r.text()).trim().split(/\r?\n/).forEach((l,i)=>{
      try{ const o=JSON.parse(l); by.set(o.id==null?('#'+i):o.id, o); }catch(e){}
    });
    DIVS=Array.from(by.values()); DIVS_OK=true;
  }catch(e){ if(DIVS===null) DIVS=[]; }      // [] lets the day sheet render; not OK, so retried
  return DIVS;
}
function calDay(d){
  SHEET_D=d;
  renderSheet();
  // the ledgers are only needed once a day is actually tapped
  // No captured-day guard: renderSheet already no-ops on a closed sheet and
  // reads SHEET_D fresh, and guarding on the day that opened the fetch left the
  // second sheet stuck on "Loading the day" forever when the owner closed the
  // first one and tapped another while the ledgers were still in flight.
  Promise.all([loadParts(), loadDivs(), (FILLS===null?loadFills():null)])
    .then(()=>{ renderSheet(); });
}
function closeSheet(ev){
  if(ev&&ev.target!==ev.currentTarget) return;            // taps inside stay inside
  SHEET_D=null;
  const el=$('#day-sheet'); if(el) el.remove();
}
// Pure: (day, history, parts, fills) -> the parts of that day, or a reason why not.
function partsTs(row, day, endOfDay){
  // Rows carry the moment they were taken: "2026-09-19T23:05:11Z" from the live
  // publisher, "2026-09-19 00:25 UTC" from a reconstructed bot_state. Fall back
  // to the day's own bounds when a row has no usable stamp.
  const t=Date.parse(String((row||{}).ts||'').replace(' UTC','Z').replace(' ','T'));
  if(isFinite(t)) return t;
  return Date.parse(day+(endOfDay?'T23:59:59Z':'T00:00:00Z'));
}
function dayBreakdown(day, hist, parts, fills, divsLedger){
  const s=(((hist||{}).series)||[]).slice().sort((a,b)=>a.d<b.d?-1:1);
  const i=s.findIndex(e=>e.d===day);
  if(i<1) return {why:'This is the first day on record, so there is nothing to compare it with.'};
  const cur=s[i], prv=s[i-1];
  let fl=0;
  (((hist||{}).flows)||[]).forEach(f=>{ if(f.d>prv.d&&f.d<=cur.d) fl+=(f.amt||0); });
  const total=cur.nl-prv.nl-fl;                           // exactly the calendar's number
  // Display only, never in the total: published NetLiq is already net of the
  // earmark, so a deposit earmarked on arrival leaves nl flat and adding this
  // back booked it as "Unexplained" (board review 2026-09-21).
  const excMove=(cur.exc||0)-(prv.exc||0);
  const P=((parts||{}).days)||{};
  const a=P[prv.d], b=P[cur.d];
  if(!a||!b) return {total:total, flow:fl, why:'No breakdown was recorded for '+(b?prv.d:day)+'.'};
  // The 56 days before this feature are valued at ONE fitted rate per currency;
  // from the first live publish the rates are IB's own. Differencing across that
  // boundary reprices every foreign holding at once and books the step as
  // performance - roughly 1,900 HKD on today's book, attributed to whichever
  // positions happen to be foreign. There is no per-position currency in the
  // row to rebase with, so the honest answer for that ONE day is to say so.
  // Rows carry the currency each holding is priced in, which is what lets the
  // previous day be re-expressed at THIS day's rates. Only rows written before
  // that field existed cannot be bridged - and only then is refusing right.
  const ccyOf=sym=>(((b.pos||{})[sym]||[])[2])||(((a.pos||{})[sym]||[])[2])||null;
  const canRebase=Object.keys(b.pos||{}).some(s=>ccyOf(s));
  if(a.src!==b.src&&!canRebase) return {total:total, flow:fl,
    why:'These two days were valued in different ways and the rows are too old to carry '
       +'the currency needed to bridge them, so the day cannot be broken down.'};
  const fx=c=>((b.fx||{})[c]||(a.fx||{})[c]||null);
  // Money put into or taken out of each holding BETWEEN THE TWO SNAPSHOTS. A
  // day's row is written by whichever publish ran last that day - day_parts
  // carries 2026-08-24 07:20 UTC - so windowing by calendar date charges a fill
  // to a snapshot taken before it happened. Window by the stamps instead.
  const t0=partsTs(a, prv.d, true), t1=partsTs(b, cur.d, true);
  const traded={}, tqty={}, trades=[];
  let fees=0;
  (fills||[]).forEach(f=>{
    const ts=Date.parse(String(f.ts||f.date||'').replace(' ','T')+
      (/[Zz]|[+-]\d\d:?\d\d$/.test(String(f.ts||''))?'':'Z'));
    const d=String(f.date||'').slice(0,10);
    const inWin=isFinite(ts)&&isFinite(t0)&&isFinite(t1) ? (ts>t0&&ts<=t1)
                                                         : (d>prv.d&&d<=cur.d);
    if(!inWin) return;
    // A conversion is not a holding - but its COMMISSION is real money that has
    // already left the account and is inside NetLiq, so bank it before skipping.
    const cr=fx(f.commission_ccy||f.ccy)||0;
    fees+=(+f.commission||0)*cr;
    if(f.sec_type==='CASH') return;
    // 'estimate' rows are the 20-22 July seeding of the book: holdings rebuilt
    // from IB's average cost rather than captured executions. The price is an
    // estimate, but LEAVING THE CASH OUT is not the safe option - it books the
    // whole purchase as profit (-68,922 and +59,578 HKD on 21 and 22 July).
    const raw=String(f.symbol||'');
    const sym=(b.ib||{})[raw]||(a.ib||{})[raw]||raw;     // "DBK" -> "DBK.DE"
    const r=fx(f.ccy)||0, q=+f.qty||0;
    const cash=q*(+f.price||0)*r;
    traded[sym]=(traded[sym]||0)+(f.side==='BOT'?cash:-cash);
    tqty[sym]=(tqty[sym]||0)+(f.side==='BOT'?q:-q);
    trades.push({sym:raw, side:f.side, qty:q, price:+f.price||0, ccy:f.ccy,
                 fee:(+f.commission||0), feeCcy:f.commission_ccy||f.ccy,
                 manual:f.source==='manual', est:f.source==='estimate'});
  });
  const syms=new Set(Object.keys(a.pos||{}).concat(Object.keys(b.pos||{})));
  const rows=[];
  let explained=0, unpriced=0, fxPos=0, anchorAdj=0;
  const fxBy={};                      // the currency effect, split by currency
  // The rebuilt rows are SCALED so each day adds up to what IB valued the
  // account at. That makes the totals the broker's own - but each day is scaled
  // by its own factor, so differencing the stored values books the change in
  // scale as a move on every holding. Measured on 2026-07-29 (0.99993 ->
  // 1.01852): NTRS fell 252 by the closes and would read +7, CRWD -172 would
  // read +65, and the rows would sum to +496 where the closes say -3,120.
  // So undo the scale here, difference the honest close-to-close values, and
  // show what the scaling was worth as its own line. Smearing it across the
  // movers is precisely what this file says elsewhere never to do.
  const anA=(+a.anchor)||1, anB=(+b.anchor)||1;
  syms.forEach(sym=>{
    const ra=(a.pos||{})[sym], rb=(b.pos||{})[sym];
    // Absent from a day = not held = worth 0. PRESENT with a null value = held
    // but UNPRICED (no rate, or IB sent no mkt_value). Those are not the same
    // thing, and a missing rate is one-sided on its first day - so treating a
    // null as 0 would print "5301.T closed -10,822" on a day nothing was sold.
    if((ra&&ra[1]===null)||(rb&&rb[1]===null)){ unpriced++; return; }
    const rawA=ra?ra[1]:0, rawB=rb?rb[1]:0;
    const va=rawA/anA, vb=rawB/anB;             // as the published closes had it
    anchorAdj+=(rawB-vb)-(rawA-va);             // what the scaling moved
    // Re-express yesterday's value at TODAY's rate before differencing, so the
    // position line is the share moving and not the currency moving. What the
    // rebase adds is the currency's own effect on that holding, banked below.
    const c=ccyOf(sym), r0=c?((a.fx||{})[c]):null, r1=c?((b.fx||{})[c]):null;
    let base=va;
    if(va&&r0&&r1&&r0!==r1){ base=va*(r1/r0); fxPos+=base-va; fxBy[c]=(fxBy[c]||0)+(base-va); }
    const amt=vb-base-(traded[sym]||0);
    explained+=amt;
    rows.push({sym:sym, amt:amt, qty:(rb?rb[0]:0)||(ra?ra[0]:0)||0,
               opened:!va&&!!vb, closed:!!va&&!vb});
  });
  // A symbol traded inside the window but held at NEITHER snapshot was bought
  // and sold between them. Its cash is real P&L and was being computed and then
  // dropped on the floor: a same-day round trip printed its whole profit as
  // "unexplained", directly above the two trades that made it. Only count it
  // when the net quantity comes back to flat, so a half-captured position
  // cannot be mistaken for one.
  Object.keys(traded).forEach(sym=>{
    if((a.pos||{})[sym]||(b.pos||{})[sym]) return;
    if(Math.abs(tqty[sym]||0)>1e-9) return;               // not actually flat
    const amt=-traded[sym];
    if(!amt) return;
    explained+=amt;
    rows.push({sym:sym, amt:amt, qty:0, roundTrip:true});
  });
  // cash sitting in a foreign currency gains or loses as the rate moves
  let fxCash=0;
  Object.keys(a.cash||{}).forEach(c=>{
    const ra=(a.fx||{})[c], rb=(b.fx||{})[c];
    if(ra&&rb){ const v=(a.cash[c]||0)*(rb-ra); fxCash+=v; fxBy[c]=(fxBy[c]||0)+v; }
  });
  // Dividends and withholding tax are dated, named money. They were landing in
  // "unexplained" for no better reason than not being wired up.
  let divs=0; const divRows=[];
  (divsLedger||[]).forEach(x=>{
    const d=String(x.date||'').slice(0,10);
    if(!(d>prv.d&&d<=cur.d)) return;
    const r=fx(x.ccy)||0, v=(+x.amount||0)*r;
    divs+=v;
    divRows.push({sym:String(x.symbol||''), amt:v, wht:x.type==='wht'});
  });
  // Holdings and cash together. For an HKD account holding foreign shares this
  // is real money. The ONE exception is the day the rates changed basis from
  // fitted to measured, where it is an artefact of the method - so it is
  // labelled differently rather than quietly counted as performance.
  const fxAll=fxPos+fxCash, fxArtefact=(a.src!==b.src);
  // fxPos was taken OUT of each position line by the rebase, so it has to come
  // back here or the whole currency effect lands in "unexplained".
  // the scaling is part of the day's total, it just is not a market move
  explained+=fxPos+fxCash-fees+divs+anchorAdj;
  // A reconstructed day's values are built from ONE fitted rate per currency, so
  // each day carries a known error ("fit") and the breakdown sees the CHANGE in
  // it. That is arithmetic, not money: name it rather than leave the owner
  // staring at an "unexplained" number nobody can account for.
  // A row's own values are positions + cash. NetLiq is the BROKER's figure and
  // carries accruals (dividends and interest not yet paid) that no position or
  // cash balance shows, so the two differ by a knowable amount - the backfill
  // stores it as "fit". A live row carries none, and it is emphatically not 0:
  // 2026-09-19's parts sum to 217,586 against a NetLiq of 217,662. Asserting 0
  // stranded that 76 HKD in "unexplained" and would have dumped every later
  // day's accrual drift there too. Compute it instead; null (and so recon 0)
  // only when the row cannot be summed at all, so one unpriced holding can
  // never masquerade as a huge measurement error.
  const fitOf=x=>{
    if(typeof x.fit==='number') return x.fit;
    let est=0;
    for(const s in (x.pos||{})){
      const v=(x.pos[s]||[])[1];
      if(typeof v!=='number') return null;
      est+=v;
    }
    for(const c in (x.cash||{})){
      const r=(x.fx||{})[c];
      if(!r) return null;
      est+=(x.cash[c]||0)*r;
    }
    // nl is net of the earmark while the row's cash still holds it, so exc is
    // added back HERE to compare like with like. That is not P&L, and it is
    // why a deposit earmarked on arrival leaves this line at 0 too.
    return est-((+x.nl||0)+(+x.exc||0));
  };
  const fa=fitOf(a), fb=fitOf(b);
  const recon=(fa!==null&&fb!==null)?-(fb-fa):0;
  explained+=recon;
  rows.sort((x,y)=>Math.abs(y.amt)-Math.abs(x.amt));
  return {total:total, flow:fl, earmark:excMove, prev:prv.d, rows:rows, trades:trades,
          fees:fees, fxCash:fxCash, fxAll:fxAll, fxArtefact:fxArtefact, fxBy:fxBy,
          divs:divs, divRows:divRows, anchorAdj:anchorAdj,
          anchored:(typeof b.anchor==='number'),
          // "accruals" is only the right name for the leftover once BOTH days
          // were actually scaled onto IB's figure. The 5% guard deliberately
          // leaves a day unscaled, and that row's gap is still the whole
          // published-closes-vs-broker difference, which is not a dividend.
          accrual:(a.src!=='reconstructed'||typeof a.anchor==='number')
                &&(b.src!=='reconstructed'||typeof b.anchor==='number'),
          recon:recon, unpriced:unpriced, resid:total-explained,
          src:(b.src==='live'&&a.src==='live')?'live':'reconstructed', ts:b.ts||''};
}
function renderSheet(){
  const day=SHEET_D; if(!day) return;
  let el=$('#day-sheet');
  if(!el){
    el=document.createElement('div');
    el.id='day-sheet'; el.className='sheet-bg';
    el.setAttribute('onclick','closeSheet(event)');
    document.body.appendChild(el);
  }
  const money=v=>(v>0?'+':v<0?'−':'')+Math.abs(Math.round(v)).toLocaleString();
  const nice=new Date(Date.parse(day+'T00:00:00Z')).toLocaleDateString('en-GB',
    {weekday:'short', day:'numeric', month:'long', timeZone:'UTC'});
  if(!PARTS||PARTS.err){
    // "could not download" and "never recorded" are different statements, and
    // only one of them is worth retrying. Saying the wrong one tells the owner
    // his data does not exist.
    el.innerHTML='<div class="sheet"><div class="sheet-grip"></div>'
      +'<b style="font-size:17px">'+nice+'</b>'
      +'<div class="muted" style="padding:18px 0">'
      +(PARTS&&PARTS.err?'Could not load the breakdown - tap the day again to retry.'
                        :'Loading the day…')+'</div></div>';
    return;
  }
  const r=dayBreakdown(day, CAL, PARTS.err?null:PARTS, FILLS, DIVS);
  const head='<div class="sheet-grip"></div>'
    +'<div class="row" style="align-items:flex-start">'
    +'<div><b style="font-size:17px">'+nice+'</b>'
    +(r.total!=null?'<div class="'+(r.total>0?'pnl-pos':r.total<0?'pnl-neg':'')+'"'
      +' style="font-size:23px;font-weight:800;line-height:1.2">'+money(r.total)+' HKD</div>':'')
    +'</div><button class="btn-sm" onclick="closeSheet()">Close</button></div>';
  if(r.why){
    el.innerHTML='<div class="sheet">'+head
      +'<div class="muted" style="padding:14px 0 4px">'+escH(r.why)+'</div>'
      +'<div class="nm" style="font-size:11px;opacity:.75">Days are recorded from the publish that '
      +'follows a deploy, and reconstructed further back from the bot’s own state history.</div></div>';
    return;
  }
  const top=r.rows.slice(0,9), rest=r.rows.slice(9);
  const restSum=rest.reduce((a,x)=>a+x.amt,0);
  const big=Math.max.apply(null,[1].concat(r.rows.map(x=>Math.abs(x.amt))));
  const part=(name,amt,note)=>'<div class="part"><span>'+escH(name)
    +(note?' <span class="nm" style="font-size:11px">'+escH(note)+'</span>':'')+'</span>'
    +'<b class="'+(amt>0?'pnl-pos':amt<0?'pnl-neg':'')+'">'+money(amt)+'</b>'
    +'<div class="bar"><i style="width:'+Math.round(100*Math.min(1,Math.abs(amt)/big))+'%;'
    +'background:'+(amt>0?'#29d086':'#e5484d')+'"></i></div></div>';
  const tradeRow=t=>'<div class="row" style="padding:3px 0"><span class="nm">'
    +'<b style="color:'+(t.side==='BOT'?'#4d9bff':'#e5a23d')+'">'+(t.side==='BOT'?'BUY':'SELL')+'</b> '
    +escH(t.sym)+' '+t.qty+' @ '+t.price+' '+escH(t.ccy||'')
    +(t.manual?' · by hand':'')+(t.est?' · estimated':'')+'</span>'
    +'<span class="nm">'+(t.fee?('fee '+t.fee+' '+escH(t.feeCcy||'')):'')+'</span></div>';
  el.innerHTML='<div class="sheet">'+head
    +(r.fxArtefact?'<div class="nm" style="padding:8px 0 2px;font-size:11.5px;'
        +'border-left:2px solid var(--amber);padding-left:8px">'
        +'Nothing below is a market move. This day is the changeover from published '
        +'closing prices to the broker’s own marks, and the two price the same close '
        +'differently — the broker prices the closing auction and after-hours trade. '
        +'On 2026-09-19 that put DELL at 571.00 against a 568.06 close, which is the '
        +'whole of its line below.'
        +'</div>':'')
    +'<div class="sec-h" style="margin-top:10px">'
      +(r.fxArtefact?'Difference between the two valuations':'What moved')+'</div>'
    +top.map(x=>part(x.sym, x.amt, x.roundTrip?'bought and sold'
        :x.opened?'opened':x.closed?'closed':(x.qty?x.qty+' held':''))).join('')
    +(rest.length?part(rest.length+' smaller positions', restSum, ''):'')
    +Object.keys(r.fxBy||{}).filter(c=>Math.abs(r.fxBy[c])>=1)
       .sort((x,y)=>Math.abs(r.fxBy[y])-Math.abs(r.fxBy[x]))
       .map(c=>part(c+' exchange rate', r.fxBy[c],
          r.fxArtefact?'change of measurement, not a market move'
                      :'on holdings and cash in '+c)).join('')
    +(Math.abs(r.divs)>=1?part('Dividends', r.divs,
        r.divRows.map(x=>x.sym).filter((v,i,s)=>s.indexOf(v)===i).join(', ')
        +(r.divRows.some(x=>x.wht)?' (after withholding tax)':'')):'')
    +(r.fees?part('Commissions', -r.fees, ''):'')
    +(Math.abs(r.anchorAdj)>=1?part('Price source', r.anchorAdj,
        'published closes against the broker’s own valuation — measurement, not money'):'')
    +(Math.abs(r.recon)>=1?part(r.accrual?'Accrued, not yet paid':'Price source', r.recon,
        r.accrual?'dividends and interest inside the broker’s valuation'
                 :'published closes against the broker’s valuation — measurement, not money'):'')
    +(Math.abs(r.resid)>=1?part('Unexplained', r.resid,
        'rounding, and the minutes between the two snapshots'):'')
    +(r.trades.length?'<div class="sec-h" style="margin-top:12px">Traded that day</div>'
      +r.trades.map(tradeRow).join(''):'')
    +(r.flow?'<div class="nm" style="padding-top:8px">A deposit or withdrawal of '
      +money(r.flow)+' HKD is excluded from the figure above.</div>':'')
    +(r.earmark?'<div class="nm" style="padding-top:4px">Earmarked cash changed by '
      +money(r.earmark)+' HKD. Net worth never includes earmarked money, so money earmarked '
      +'as it arrived, or withdrawn while still earmarked, is not in the figure above.</div>':'')
    +'<div class="nm" style="font-size:11px;opacity:.75;padding-top:10px">'
    +'Measured against '+r.prev
    +(r.unpriced?' · '+r.unpriced+' holding'+(r.unpriced===1?'':'s')+' had no price':'')+'. '
    +(r.src==='reconstructed'
      ? (r.anchored
        ? 'The day’s TOTAL is the broker’s own figure. Each holding’s move is its '
        +'published closing price, and whatever the two disagree by is the '
        +'\u201cprice source\u201d line above rather than hidden inside the holdings. '
        +'We only began recording the broker’s own per-holding marks on 2026-09-19.'
        : 'This day could NOT be reconciled to the broker’s own valuation — the rescale it '
          +'needed was too large to trust — so it stands on the published closes alone, and '
          +'the gap to the broker’s figure is the “price source” line above.')
      : 'Measured from the broker’s own snapshots of both days.')
    +'</div></div>';
}
function calShift(n){
  const [y,m]=CAL_YM.split('-').map(Number);
  const d=new Date(Date.UTC(y,m-1+n,1));
  CAL_YM=d.toISOString().slice(0,7);
  renderCal();
}
function renderCal(){
  const el=$('#v-calendar'), s=CAL.series||[], flows=CAL.flows||[];
  if(!s.length){ el.innerHTML='<div class="muted" style="padding:20px">No history yet.</div>'; return; }
  // daily trading P&L: change vs the PREVIOUS recorded day, minus every cash
  // flow dated in the window (prev, d] — a flow on a missed-publish day must
  // not leak into the next day's number as fake trading P&L
  const pnl={}, pct={}, byD={}, hasFlow={}, grow={};
  s.forEach(e=>byD[e.d]=e.nl);
  for(let i=1;i<s.length;i++){
    const d=s[i].d, pd=s[i-1].d, prev=s[i-1].nl;
    let fl=0;
    flows.forEach(f=>{ if(f.d>pd&&f.d<=d){ fl+=f.amt; hasFlow[d]=true; } });
    // Earmarked cash is NOT added back (board review 2026-09-21, reversing
    // 8b214e2). Both publishers write a NetLiq already NET of it, and the
    // owner's monthly pass-through - GBP deposited, converted to HKD and
    // earmarked the same day, withdrawn early the next month, neither leg in
    // flows - leaves that net figure flat. Adding the change in "exc" back
    // painted the deposit as a green gain and the withdrawal as a red loss.
    // A day the earmark moved still gets the ⇄ mark, so the step is visible.
    if((s[i].exc||0)!==(s[i-1].exc||0)) hasFlow[d]=true;
    pnl[d]=s[i].nl-prev-fl;
    // Measure the day against the capital actually at work that day: yesterday's
    // NetLiq PLUS today's deposits/withdrawals, taken as arriving at the start of
    // the day. Yesterday alone overstates the base on a withdrawal day and
    // understates it on a deposit day.
    const base=prev+fl;
    pct[d]=base>0?100*pnl[d]/base:0;
    grow[d]=base>0?s[i].nl/base:1;             // 1 + that day's return
  }
  const [y,m]=CAL_YM.split('-').map(Number);
  const first=new Date(Date.UTC(y,m-1,1)), dim=new Date(Date.UTC(y,m,0)).getUTCDate();
  const lead=(first.getUTCDay()+6)%7;                       // Monday-first grid
  const mName=first.toLocaleDateString('en-GB',{month:'long',year:'numeric',timeZone:'UTC'});
  // month totals over days that HAVE a P&L entry this month
  // Month % is TIME-WEIGHTED: the daily returns above, compounded. It used to be
  // the month's P&L over NetLiq on the day before the month began - which for
  // August meant dividing by 31 July's 235,861 although HK$32,000 was withdrawn
  // on 2 August and only ~204k was at work for the other 30 days. That showed
  // +7,189 as 3.05%; time-weighted it is 3.53%. In a month with no deposit or
  // withdrawal the two are identical, so September's 3.07% does not move.
  let mTot=0, mGrow=1, nGreen=0, nRed=0;
  for(let i=1;i<s.length;i++){
    if(s[i].d.slice(0,7)===CAL_YM){
      mTot+=pnl[s[i].d];
      mGrow*=grow[s[i].d];
      if(pnl[s[i].d]>0) nGreen++; else if(pnl[s[i].d]<0) nRed++;
    }
  }
  const mPct=100*(mGrow-1);
  const money=v=>(v>0?'+':v<0?'−':'')+Math.abs(Math.round(v)).toLocaleString();
  const cells=[];
  for(let i=0;i<lead;i++) cells.push('<div class="cal-cell cal-empty"></div>');
  for(let day=1;day<=dim;day++){
    const d=`${CAL_YM}-${String(day).padStart(2,'0')}`;
    if(!(d in pnl)){
      cells.push(`<div class="cal-cell ${d in byD?'':'cal-empty'}"><span class="cal-d">${day}</span></div>`);
      continue;
    }
    const v=pnl[d], p=pct[d];
    const cls=v>0?'cal-up':v<0?'cal-dn':'';
    const flow=hasFlow[d]?`<span class="cal-flow" title="deposit/withdrawal excluded">⇄</span>`:'';
    cells.push(`<div class="cal-cell tap ${cls}" onclick="calDay('${d}')"><span class="cal-d">${day}${flow}</span>
      <b>${money(v)}</b><span class="cal-pct">${(p>0?'+':'')+p.toFixed(2)}%</span></div>`);
  }
  el.innerHTML=`
   <div class="card" style="padding:14px 16px;margin-bottom:10px">
     <div class="row" style="align-items:center">
       <button class="cal-nav" onclick="calShift(-1)">‹</button>
       <b style="font-size:17px">${mName}</b>
       <button class="cal-nav" onclick="calShift(1)">›</button>
     </div>
     <div style="margin-top:6px;font-size:22px;font-weight:800"
          class="${mTot>0?'pnl-pos':mTot<0?'pnl-neg':''}">${money(mTot)} HKD
       <span style="font-size:14px;font-weight:700">(${(mPct>0?'+':'')+mPct.toFixed(2)}%)</span></div>
     <div class="nm" style="margin-top:2px">${nGreen} green · ${nRed} red day${nGreen+nRed===1?'':'s'}
       · trading P&L only — deposits/withdrawals (⇄) excluded</div>
   </div>
   <div class="cal-grid">${['M','T','W','T','F','S','S'].map(w=>`<div class="cal-w">${w}</div>`).join('')}${cells.join('')}</div>
   <div class="nm" style="margin:10px 4px">Day P&L = NetLiq change vs the previous recorded day
     minus any deposit or withdrawal (⇄); its % is measured on the capital at work that day.
     The month % compounds the daily returns (time-weighted), so moving money in or out
     does not distort it. Day-end is the last publish before midnight UTC; weekends show
     the small drift of overnight marks.</div>`;
}

// Every five minutes: the hour's prices FIRST, then the live state. loadBot
// re-renders the position cards, and their Last, P&L, total and exit hint all
// read IDX - which stayed at page-open data while net worth above them moved,
// so a phone app resumed hours later paired the morning's prices with a fresh
// NetLiq (board review 2026-09-21). A failed or garbled pull keeps what we have.
async function liveTick(){
  try{
    const r=await fetch('data.json?t='+Date.now());
    if(r.ok){
      const d=await r.json();
      if(d&&Array.isArray(d.index)){ DATA=d; IDX=d.index; renderActions(); }
    }
  }catch(e){}
  loadBot();
}
async function boot(){
  try{
    const r=await fetch('data.json?t='+Date.now()); DATA=await r.json();
    IDX=DATA.index||[];
    // the headline says which backtest it is: the bot's own exit rules, or the validated engine if that study is missing
    $('#prod').textContent=DATA.product+' · '+DATA.generated+((DATA.headline||{}).basis?' · backtest on '+DATA.headline.basis:'');
    const h=DATA.headline||{};
    $('#stats').innerHTML=[
      ['Win rate',h.win],['CAGR',h.cagr],['Max DD',h.maxdd],['Universe',DATA.universe_count+' products']
    ].map(([k,v])=>`<div class="stat">${k}<b>${v}</b></div>`).join('');
    renderActions();renderPositions();renderHistory();renderAllProducts();
  }catch(e){ $('#prod').textContent='Could not load data.json'; }
  loadBot();                       // async: overlays live bot positions/orders
  loadTax();                       // async: UK CGT report for History > Tax
  setInterval(liveTick, 5*60*1000); // prices, then bot state, every 5 minutes
  // Remember which version of the page this is, then look again now and then.
  // 10 minutes matches the Cache-Control the site is served with, so the
  // check cannot fire sooner than the cache could possibly turn over.
  checkAppVersion();
  setInterval(checkAppVersion, 10*60*1000);
  $('#q').addEventListener('input',runSearch);
}
boot();
</script>
